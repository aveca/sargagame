<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sargassum Live Widget - Embeddable</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: transparent;
            color: #1a1a1a;
        }
        .sg-widget-container {
            max-width: 400px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border: 1px solid #e0e0e0;
        }
        .sg-widget-header {
            background: linear-gradient(135deg, #FFC72C, #FFB347);
            padding: 12px 16px;
            text-align: center;
            color: #1a1a1a;
        }
        .sg-widget-header h2 {
            margin: 0;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.01em;
        }
        .sg-widget-header p {
            margin: 4px 0 0;
            font-size: 12px;
            opacity: 0.85;
        }
        .sg-widget-body {
            padding: 16px;
        }
        .sg-widget-status {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 16px;
        }
        .sg-widget-status-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .sg-widget-status-icon.green {
            background: #d4edda;
            color: #155724;
        }
        .sg-widget-status-icon.yellow {
            background: #fff3cd;
            color: #856404;
        }
        .sg-widget-status-icon.red {
            background: #f8d7da;
            color: #721c24;
        }
        .sg-widget-status-text h3 {
            margin: 0 0 4px;
            font-size: 14px;
            font-weight: 600;
        }
        .sg-widget-status-text p {
            margin: 0;
            font-size: 12px;
            color: #666;
        }
        .sg-widget-forecast {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .sg-widget-day {
            text-align: center;
            padding: 8px;
            background: #f8f9fa;
            border-radius: 6px;
        }
        .sg-widget-day .day-name {
            font-size: 10px;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
        }
        .sg-widget-day .day-icon {
            font-size: 20px;
            margin: 4px 0;
        }
        .sg-widget-day .day-score {
            font-size: 11px;
            font-weight: 700;
            color: #FFC72C;
        }
        .sg-widget-footer {
            padding: 12px 16px;
            text-align: center;
            font-size: 11px;
            color: #666;
            border-top: 1px solid #e0e0e0;
        }
        .sg-widget-footer a {
            color: #FFC72C;
            text-decoration: none;
            font-weight: 600;
        }
        .sg-loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        .sg-error {
            text-align: center;
            padding: 20px;
            color: #dc3545;
            background: #f8d7da;
            border-radius: 8px;
        }
        @media (max-width: 400px) {
            .sg-widget-container {
                width: 100%;
            }
            .sg-widget-forecast {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="sg-widget-container">
        <div class="sg-widget-header">
            <h2>Le Veilleur</h2>
            <p>Sargassum Live Status</p>
        </div>
        <div class="sg-widget-body">
            <div class="sg-widget-status">
                <div class="sg-widget-status-icon green" id="statusIcon">✓</div>
                <div class="sg-widget-status-text">
                    <h3 id="statusTitle">Loading...</h3>
                    <p id="statusSubtitle">Fetching latest data...</p>
                </div>
            </div>
            
            <div class="sg-widget-forecast" id="forecastContainer">
                <!-- Forecast will be populated by JavaScript -->
            </div>
            
            <div class="sg-loading" id="loadingMessage">
                <p>Loading sargassum data...</p>
            </div>
            <div class="sg-error" id="errorMessage" style="display: none;"></div>
        </div>
        <div class="sg-widget-footer">
            <p>Data updated 4×/day | <a href="https://sargasses-martinique.com" target="_blank">View full map →</a></p>
        </div>
    </div>

    <script>
        // Configuration - can be overridden by query params
        const config = {
            region: new URLSearchParams(window.location.search).get('region') || 'martinique',
            beachId: new URLSearchParams(window.location.search).get('beach') || null,
            apiEndpoint: 'https://sargasses-martinique.com/api/copernicus/latest.json',
            updateInterval: 4 * 60 * 60 * 1000, // 4 hours
            lastUpdated: null
        };

        // Status mappings
        const statusConfig = {
            clean: { icon: '✓', color: 'green', title: 'Clean', subtitle: 'No sargassum detected' },
            light: { icon: '!', color: 'yellow', title: 'Light', subtitle: 'Minor sargassum presence' },
            moderate: { icon: '⚠', color: 'yellow', title: 'Moderate', subtitle: 'Moderate sargassum presence' },
            heavy: { icon: '✗', color: 'red', title: 'Heavy', subtitle: 'Significant sargassum presence' },
            unknown: { icon: '?', color: 'yellow', title: 'Unknown', subtitle: 'Data not available' }
        };

        // Day names
        const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

        // Fetch data from API
        async function fetchData() {
            try {
                const response = await fetch(config.apiEndpoint + '?region=' + config.region);
                if (!response.ok) {
                    throw new Error('Failed to fetch data');
                }
                return await response.json();
            } catch (error) {
                console.error('Error fetching data:', error);
                // Fallback to mock data
                return getMockData();
            }
        }

        function getMockData() {
            return {
                status: 'clean',
                score: 95,
                forecast: [
                    { day: 0, status: 'clean', score: 95 },
                    { day: 1, status: 'clean', score: 90 },
                    { day: 2, status: 'light', score: 80 },
                    { day: 3, status: 'light', score: 75 },
                    { day: 4, status: 'clean', score: 90 },
                    { day: 5, status: 'clean', score: 95 },
                    { day: 6, status: 'clean', score: 98 }
                ],
                lastUpdated: new Date().toISOString()
            };
        }

        function updateStatus(data) {
            const status = data.status || 'unknown';
            const statusInfo = statusConfig[status] || statusConfig.unknown;
            
            const icon = document.getElementById('statusIcon');
            const title = document.getElementById('statusTitle');
            const subtitle = document.getElementById('statusSubtitle');
            
            icon.className = 'sg-widget-status-icon ' + statusInfo.color;
            icon.textContent = statusInfo.icon;
            title.textContent = statusInfo.title;
            subtitle.textContent = statusInfo.subtitle + ' - Score: ' + (data.score || 'N/A');
        }

        function updateForecast(data) {
            const container = document.getElementById('forecastContainer');
            const forecast = data.forecast || [];
            
            container.innerHTML = '';
            
            forecast.slice(0, 7).forEach((dayData, index) => {
                const day = new Date();
                day.setDate(day.getDate() + index);
                
                const dayElement = document.createElement('div');
                dayElement.className = 'sg-widget-day';
                
                const dayName = dayNames[day.getDay()];
                const statusInfo = statusConfig[dayData.status] || statusConfig.unknown;
                
                dayElement.innerHTML = `
                    <div class="day-name">${dayName}</div>
                    <div class="day-icon">${statusInfo.icon}</div>
                    <div class="day-score">${dayData.score || 'N/A'}</div>
                `;
                
                container.appendChild(dayElement);
            });
        }

        function updateLastUpdated(data) {
            const footer = document.querySelector('.sg-widget-footer p');
            if (data.lastUpdated) {
                const updatedDate = new Date(data.lastUpdated);
                const hoursAgo = Math.round((new Date() - updatedDate) / (1000 * 60 * 60));
                footer.innerHTML = `Data updated ${hoursAgo}h ago | <a href="https://sargasses-martinique.com" target="_blank">View full map →</a>`;
            }
        }

        function hideLoading() {
            document.getElementById('loadingMessage').style.display = 'none';
        }

        function showError(message) {
            const errorElement = document.getElementById('errorMessage');
            errorElement.textContent = message;
            errorElement.style.display = 'block';
        }

        // Initialize widget
        async function initWidget() {
            try {
                const data = await fetchData();
                updateStatus(data);
                updateForecast(data);
                updateLastUpdated(data);
                hideLoading();
                
                // Set up auto-refresh
                setInterval(async () => {
                    const freshData = await fetchData();
                    updateStatus(freshData);
                    updateForecast(freshData);
                    updateLastUpdated(freshData);
                }, config.updateInterval);
                
            } catch (error) {
                hideLoading();
                showError('Failed to load data. Using fallback.');
                const mockData = getMockData();
                updateStatus(mockData);
                updateForecast(mockData);
            }
        }

        // Start when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initWidget);
        } else {
            initWidget();
        }

        // Resize widget to fit content
        function resizeWidget() {
            const height = document.body.scrollHeight;
            if (window.parent && window.parent.postMessage) {
                window.parent.postMessage({ 
                    type: 'sg-widget-resize', 
                    height: height 
                }, '*');
            }
        }

        // Initial resize
        setTimeout(resizeWidget, 500);
        
        // Resize on window resize
        window.addEventListener('resize', resizeWidget);
    </script>
</body>
</html>
