<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Paiement réussi — Sargasses</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  :root{--ink:#0A1714;--card:#10231E;--or:#FFC72C;--orL:#FFE08A;--teal:#5FD3C9;
    --clean:#22C55E;--mod:#F59E0B;--avoid:#E8522A}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:linear-gradient(180deg,#0B2230,#155A5A 52%,#C97E3A 84%,#F2B05E);
    color:#fff;font-family:'Bricolage Grotesque',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;
    padding:24px;min-height:100vh}
  .wrap{width:100%;max-width:440px;text-align:center}
  .sat{width:54px;height:54px;margin:0 auto 14px;display:block}
  .eyebrow{font:700 11px ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;
    color:rgba(255,255,255,.8);margin:0 0 6px}
  h1{font-family:'Anton',system-ui,sans-serif;font-weight:400;letter-spacing:.01em;
    text-transform:uppercase;font-size:clamp(26px,7vw,40px);line-height:1.02;margin:0 0 6px;
    text-shadow:0 2px 16px rgba(0,0,0,.35)}
  .q{font-size:15px;color:rgba(255,255,255,.9);margin:0 0 22px}
  .btns{display:flex;flex-direction:column;gap:12px}
  button{appearance:none;border:0;cursor:pointer;border-radius:16px;padding:18px 20px;
    font:800 17px 'Bricolage Grotesque',system-ui,sans-serif;color:#0A1714;
    display:flex;align-items:center;gap:14px;text-align:left;box-shadow:0 6px 20px rgba(0,0,0,.22);
    transition:transform .12s cubic-bezier(.34,1.56,.64,1)}
  button:active{transform:scale(.97)}
  button .em{font-size:26px;line-height:1}
  .b-clean{background:linear-gradient(180deg,#34D77f,#22C55E)}
  .b-mod{background:linear-gradient(180deg,#FFC34d,#F59E0B)}
  .b-avoid{background:linear-gradient(180deg,#F4845F,#E8522A);color:#fff}
  .note{font-size:12px;color:rgba(255,255,255,.66);margin:18px 0 0}
  .done{display:none}
  .done .big{font-size:46px;margin:0 0 8px}
  .verdict{margin:16px auto 0;max-width:360px;background:rgba(8,18,16,.42);border:1px solid rgba(255,255,255,.14);
    border-radius:14px;padding:12px 14px;font-size:13.5px;color:rgba(255,255,255,.88)}
  a{color:var(--orL);text-decoration:none}
  .success-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(34,197,94,.15);
    border:1px solid rgba(34,197,94,.4);border-radius:999px;padding:8px 16px;margin:0 0 12px;
    font:700 12px ui-monospace,monospace;letter-spacing:.05em;text-transform:uppercase;color:var(--clean)}
</style>
</head>
<body>
<div class="wrap">
  <div class="success-badge">✅ Paiement confirmé</div>

  <svg class="sat" viewBox="0 0 64 64" aria-hidden="true"><g transform="translate(32,33)">
    <circle r="22" fill="#22C55E" opacity=".15"/><circle r="14" fill="#22C55E" opacity=".12"/>
    <circle cx="0" cy="2" r="10" fill="none" stroke="#22C55E" stroke-width="2.5"/>
    <polyline points="-4,2 0,6 5,-3" fill="none" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g></svg>

  <p class="eyebrow">Transaction validée</p>
  <h1>Merci !</h1>
  <p class="q">Ton accès premium est activé. Le Veilleur t'accompagne maintenant sur chaque plage.</p>

  <div class="verdict" style="background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.3);">
    <div id="accessInfo"></div>
  </div>

  <div class="btns">
    <button class="b-clean" onclick="go()">
      <span class="em">🗺️</span><span>Voir la carte</span>
    </button>
    <button class="b-mod" onclick="location.href='/pro/espace/'">
      <span class="em">🏢</span><span>Espace Pro</span>
    </button>
  </div>

  <p class="note">Ton pass est lié à ton email. Connecte-toi sur n'importe quel appareil pour retrouver tes avantages.</p>
</div>

<script>
(function(){
  var P = new URLSearchParams(location.search);
  var kind = P.get('kind') || 'pass'; // pass | pro | brief
  var email = P.get('email') || '';
  var plan = P.get('plan') || '';

  var T = {
    fr: {
      pass: {title: 'Pass activé', desc: 'Accès illimité aux prévisions J+7, verdicts par plage, alertes météo.'},
      pro: {title: 'Pro activé', desc: 'Tableau de bord hôtelier, API, alertes par zone, support prioritaire.'},
      brief: {title: 'Brief activé', desc: 'Résumé quotidien par email, verdict matinal, zéro bruit.'}
    },
    en: {
      pass: {title: 'Pass activated', desc: 'Unlimited J+7 forecasts, per-beach verdicts, weather alerts.'},
      pro: {title: 'Pro activated', desc: 'Hotel dashboard, API, zone alerts, priority support.'},
      brief: {title: 'Brief activated', desc: 'Daily email summary, morning verdict, zero noise.'}
    },
    es: {
      pass: {title: 'Pass activado', desc: 'Acceso ilimitado a previsiones J+7, veredictos por playa, alertas météo.'},
      pro: {title: 'Pro activado', desc: 'Panel hotelero, API, alertas por zona, soporte prioritario.'},
      brief: {title: 'Brief activado', desc: 'Resumen diario por email, veredicto matutino, cero ruido.'}
    }
  };

  var lang = (document.documentElement.lang || 'fr').slice(0,2);
  var t = T[lang] || T.fr;
  var info = t[kind] || t.pass;

  document.documentElement.lang = lang;
  document.title = info.title + ' — Sargasses';

  document.querySelector('h1').textContent = info.title;
  document.querySelector('.q').textContent = info.desc;

  // Les paramètres d'URL sont non fiables : ne jamais les interpoler dans innerHTML.
  var accessInfo = document.getElementById('accessInfo');
  if (email || plan) {
    if (email) {
      var emailLine = document.createElement('div');
      emailLine.style.marginBottom = '8px';
      emailLine.textContent = '📧 ' + email;
      accessInfo.appendChild(emailLine);
    }
    if (plan) {
      var planLine = document.createElement('div');
      planLine.style.fontSize = '13px';
      planLine.style.opacity = '.8';
      planLine.textContent = 'Plan : ' + plan;
      accessInfo.appendChild(planLine);
    }
  } else {
    var fallback = document.createElement('div');
    fallback.style.opacity = '.7';
    fallback.textContent = 'Détails envoyés par email';
    accessInfo.appendChild(fallback);
  }

  // i18n buttons
  var btns = {
    fr: {map: 'Voir la carte', pro: 'Espace Pro'},
    en: {map: 'See map', pro: 'Pro space'},
    es: {map: 'Ver mapa', pro: 'Espacio Pro'}
  };
  var b = btns[lang] || btns.fr;
  document.querySelector('.b-clean span:last-child').textContent = b.map;
  document.querySelector('.b-mod span:last-child').textContent = b.pro;
})();

// Retour à l'app : si l'email est connu, on passe par le deep-link de restauration
// /?premium_email= (sgVerifySub → droits posés côté app + toast). Ceinture+bretelles :
// le redirectUrl primaire (/?mollie_return=1) est demandé au serveur à create_payment ;
// ce fallback couvre les anciens paiements encore en vol.
function go(){
  var P = new URLSearchParams(location.search);
  var email = P.get('email') || '';
  if (email.indexOf('@') > 0) location.href = '/?premium_email=' + encodeURIComponent(email);
  else location.href = '/';
}
</script>
</body>
</html>
