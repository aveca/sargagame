<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0;url=/sargagame/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Redirection… · Sargasses</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preload" href="/sargagame/fonts/bricolagegrotesque-3y9K6as8bTXq_nANBjzKo3IeZx8z6up5BeSl9D4dj_x9PpZBMlGIInE.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/sargagame/fonts/anton-1Ptgg87LROyAm3Kz-C8.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/sargagame/fonts/fonts.css" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="/sargagame/fonts/fonts.css" /></noscript>
  <style>
    :root,.theme-light{--sg-bg:#FFFFFF;--sg-ink:#000000;--sg-mid:#000000;--sg-mute:#333333;--sg-link:#009688;}
    .theme-dark{--sg-bg:#0d1117;--sg-ink:#e6edf3;--sg-mid:#adbac7;--sg-mute:#8b949e;--sg-link:#009688;}
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{font-family:'Bricolage Grotesque',system-ui,sans-serif;background:var(--sg-bg);color:var(--sg-ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px 40px;text-align:center;line-height:1.6}
    .code{font-family:'Anton','Impact',sans-serif;font-size:4rem;line-height:1;color:var(--sg-link);margin-bottom:12px}
    h1{font-family:'Anton','Impact',sans-serif;font-size:1.5rem;letter-spacing:.05em;text-transform:uppercase;margin-bottom:12px;color:var(--sg-ink)}
    p{max-width:360px;margin-bottom:24px;color:var(--sg-mid)}
    .spinner{width:30px;height:30px;border:3px solid var(--sg-mute);border-top-color:var(--sg-link);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 20px}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.spinner{animation:none}}
  </style>
  <script>
    (function(){ try { var v = localStorage.getItem("sg_theme"); if (v === "dark") document.documentElement.classList.add("theme-dark"); else if (v !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("theme-dark"); } catch (e) {} })();
  </script>
  <!-- Instant JS redirect (faster than meta refresh) -->
  <script>
    (function(){
      try {
        var isGH = location.hostname === 'aveca.github.io';
        if (!isGH) return;
        var base = '/sargagame';
        var path = location.pathname;
        // If already at a real file (like 404.html itself), skip
        if (path === '/404.html' || path === '/') return;
        // Redirect to root — SPA will handle routing via getPathname()
        window.location.replace(base + '/');
      } catch(e) {}
    })();
  </script>
</head>
<body>
  <div class="spinner"></div>
  <div class="code">404</div>
  <h1>Le Veilleur redirige…</h1>
  <p>Cette page n'existe pas sur l'hébergement de secours. Tu es redirigé vers la carte.</p>
  <p><a href="/sargagame/" style="color:var(--sg-link)">→ Aller à la carte maintenant</a></p>
</body>
</html>
