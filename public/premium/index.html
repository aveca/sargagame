<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>Prévisions sargasses — Accès premium</title><meta name="description" content="Prévisions sargasses complètes, plage par plage. J+1 à J+7, alertes push. À partir de 4,99 €/mois."><style>html,body{margin:0;padding:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;background:#0b1015;color:#e6edf3;max-width:600px;margin:0 auto;padding:20px}h1{font-size:2rem;margin:0 0 8px}.sub{color:#9aa3af;margin-bottom:24px}.price{font-size:2rem;font-weight:700;margin:16px 0}.offer{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:20px;margin-bottom:16px}.best{border-color:#00786C;background:rgba(0,120,108,.06)}button{width:100%;padding:14px;border:none;border-radius:8px;background:#00786C;color:#fff;font-weight:700;font-size:1rem;cursor:pointer;margin-top:12px}button:hover{background:#00A39B}input{width:100%;padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:transparent;color:#fff;font-size:1rem;margin-bottom:12px}#msg{margin-top:12px;padding:10px;border-radius:8px;display:none}#msg.ok{background:#0b2a22;color:#a7f3d0;border:1px solid #00786C}#msg.err{background:#2a160e;color:#fecaca;border:1px solid #B87A00}</style></head><body><header style="padding:16px 0"><h1>Prévisions sargasses — Accès premium</h1><p class="sub">Prévisions 7 jours · alertes push · carte en direct · sans publicité</p></header><div class="price">4,99 €/mois</div><div class="offer best"><div class="price">4,99 €</div><div style="color:#9aa3af">Accès 30 jours — accès complet à toutes les plages</div><button id="buy30">S'abonner 4,99 €/mois</button></div><div class="offer"><div class="price">14,99 €</div><div style="color:#9aa3af">Accès 30 jours — accès premium</div><button id="buy30alt">S'abonner 14,99 €/mois</button></div><form id="emailForm" style="margin-top:24px"><label style="display:block;margin-bottom:8px">Votre email (pour recevoir l'accès)</label><input type="email" id="email" placeholder="vous@exemple.com" required style="width:100%;padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:transparent;color:#fff;font-size:1rem"><button type="submit" style="width:100%;padding:14px;margin-top:8px;border:none;border-radius:8px;background:#00786C;color:#fff;font-weight:700;font-size:1rem;cursor:pointer">S'abonner et payer 4,99 €/mois</button></form><div id="msg"></div><footer style="margin-top:40px;color:#9aa3af;font-size:.85rem">Sargasses — Prévisions sargasses en temps réel</footer><script>const btn=document.getElementById('buy30');const btn2=document.getElementById('buy30alt');const email=document.getElementById('email');const msg=document.getElementById('msg');function showMsg(t,type){msg.textContent=t;msg.className='msg '+type;msg.style.display='block';setTimeout(()=>msg.style.display='none',5000)}async function pay(pass,cents,cur,label){if(!email.value||!email.value.includes('@')){showMsg('Entrez un email valide.','err');return}btn.disabled=true;btn.textContent='Paiement...';try{const r=await fetch('/api/mollie.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'create_payment',pass:pass,currency:cur,cents:cents,email:email.value,lang:'fr'})});const j=await r.json();if(!r.ok)throw new Error(j.error||'échec');if(j.checkoutUrl)window.location.href=j.checkoutUrl;else throw new Error(j.error||'pas de lien')}catch(e){showMsg('Paiement impossible. Réessayez.','err');btn.disabled=false;btn.textContent='S\'abonner 4,99 €/mois'}}btn.addEventListener('click',()=>pay('p30',1499,'EUR','p30'));btn2.addEventListener('click',()=>pay('p30',1499,'EUR','p30'));</script></body></html>
