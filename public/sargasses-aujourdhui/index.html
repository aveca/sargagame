  <h1 style="font-size:28px;font-weight:900;margin:0 0 12px;color:#0A1714">Sargasses aujourd'hui en Martinique et Guadeloupe</h1>
  <p style="font-size:16px;color:#555;margin:0 0 24px;line-height:1.6">Consulte les dernières observations satellite disponibles pour 136 plages de Martinique et Guadeloupe. L'ancienneté et le niveau de confiance peuvent varier selon les passages et la couverture nuageuse. Vérifie la date des données dans la carte lorsqu'elle est affichée, avant de te déplacer. Mesuré au satellite, pas deviné — et quand on se trompe, on l'écrit.</p>

  <h2 style="font-size:20px;font-weight:800;color:#0A1714;margin:32px 0 10px">Comment interpréter les observations satellite ?</h2>
  <p style="font-size:15px;color:#555;line-height:1.6">Les passages satellite ne sont pas continus et peuvent être affectés par les nuages ou la disponibilité des données. L'indice <strong>AFAI</strong> (Alternative Floating Algae Index) aide à repérer les radeaux de sargasses flottants au large ; il ne garantit pas l'état exact du rivage au moment où tu lis cette page. Une observation ancienne ou incomplète doit être interprétée avec prudence. Données publiques, méthode documentée : rien de magique.</p>

  <h2 style="font-size:20px;font-weight:800;color:#0A1714;margin:32px 0 10px">Être prévenu avant de partir</h2>
  <p style="font-size:15px;color:#555;line-height:1.6">Tu peux consulter les <a href="/alertes/" style="color:#E8A800;font-weight:600">alertes du Veilleur</a> et l'aperçu disponible pour préparer ta sortie. Les notifications et les tendances dépendent de la disponibilité des données. Gratuit, sans carte bancaire — juste ton email.</p>

  <h2 style="font-size:20px;font-weight:800;color:#0A1714;margin:32px 0 10px">Quelle est la fiabilité des données ?</h2>
  <p style="font-size:15px;color:#555;line-height:1.6">La fiabilité varie selon la couverture satellite, l'ancienneté de l'observation et l'horizon considéré. Consulte notre <a href="/fiabilite/" style="color:#E8A800;font-weight:600">page fiabilité</a> pour la méthode et les métriques datées disponibles. Une observation satellite ne garantit pas l'état exact du rivage à l'instant présent.</p>
