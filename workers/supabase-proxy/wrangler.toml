name = "supabase-proxy"
main = "index.js"
compatibility_date = "2024-01-01"

# Routes for deployed domains (Barbados not yet on Cloudflare)
routes = [
  { pattern = "sargasses-martinique.com/api/supabase*", zone_name = "sargasses-martinique.com" },
  { pattern = "sargasses-guadeloupe.com/api/supabase*", zone_name = "sargasses-guadeloupe.com" },
  { pattern = "sargassummiami.com/api/supabase*", zone_name = "sargassummiami.com" },
  { pattern = "sargassumpuntacana.com/api/supabase*", zone_name = "sargassumpuntacana.com" },
  { pattern = "sargassumcancun.com/api/supabase*", zone_name = "sargassumcancun.com" },
  { pattern = "sargazotulum.com/api/supabase*", zone_name = "sargazotulum.com" }
]

[vars]
SUPABASE_URL = "https://rswdmjtdzrucqzzukfmd.supabase.co"

# Secrets (set via: wrangler secret put SECRET_NAME)
# SUPABASE_SERVICE_KEY
# SUPABASE_SERVICE_ROLE_KEY_v2