name: Deploy Live (Every Push → Production)

on:
  push:
    branches: [main]
  # Dispatch depuis daily-copernicus.yml (data fraîche, runs non-full 00/12 UTC) —
  # le commit bot ne re-déclenche pas ce workflow (GITHUB_TOKEN) → appel explicite
  # via gh workflow run. + trigger manuel de debug.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "deploy-live-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  # 1. BUILD — single build, shared artifacts
  build:
    name: Build & Bundle Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all 6 regions with VITE_REGION
        run: |
          # Region mapping: id -> project name
          # mq: sargagame, gp: sargagame-gp, florida: sargagame-florida
          # puntacana: sargagame-puntacana, rivieramaya: sargagame-rivieramaya, tulum: sargagame-tulum
          for RID in mq gp florida puntacana rivieramaya tulum; do
            echo "Building region $RID..."
            VITE_REGION=$RID npm run build
            # Copy dist to region-specific folder
            mkdir -p /tmp/region-builds/$RID
            cp -r dist/* /tmp/region-builds/$RID/
            # Copy region-specific Copernicus data into that region's dist
            mkdir -p /tmp/region-builds/$RID/api/copernicus
            for F in sargassum.json history.json; do
              SRC="public/api/copernicus/$RID/$F"
              if [ -f "$SRC" ]; then
                cp "$SRC" "/tmp/region-builds/$RID/api/copernicus/$F"
              fi
            done
            # Free tier « Ma plage » : fc7/ public (1 fichier/plage, série 7 j réelle).
            # MQ/GP : fusion ROOT (slugs sentinelles : grande-anse…) + RÉGION (mq###/gp###)
            # — ids disjoints, les deux nécessaires (sentinelles→slug, autres→id direct).
            FCDIR="/tmp/region-builds/$RID/api/copernicus/fc7"
            rm -rf "$FCDIR"; mkdir -p "$FCDIR"
            if [ "$RID" = "mq" ] || [ "$RID" = "gp" ]; then
              [ -d "public/api/copernicus/fc7" ] && cp -r "public/api/copernicus/fc7/." "$FCDIR/"
            fi
            [ -d "public/api/copernicus/$RID/fc7" ] && cp -r "public/api/copernicus/$RID/fc7/." "$FCDIR/"
          done
        env:
          DEPLOY_TARGET: cloudflare

      - name: Version stamp for MQ
        id: version-mq
        run: |
          VER=$(cat public/version.json | grep -o '"version":"[^"]*"' | cut -d'"' -f4)
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Upload region builds
        uses: actions/upload-artifact@v4
        with:
          name: dist-mq
          path: /tmp/region-builds/mq
          retention-days: 1
      - name: Upload dist-gp
        uses: actions/upload-artifact@v4
        with:
          name: dist-gp
          path: /tmp/region-builds/gp
          retention-days: 1
      - name: Upload dist-florida
        uses: actions/upload-artifact@v4
        with:
          name: dist-florida
          path: /tmp/region-builds/florida
          retention-days: 1
      - name: Upload dist-puntacana
        uses: actions/upload-artifact@v4
        with:
          name: dist-puntacana
          path: /tmp/region-builds/puntacana
          retention-days: 1
      - name: Upload dist-rivieramaya
        uses: actions/upload-artifact@v4
        with:
          name: dist-rivieramaya
          path: /tmp/region-builds/rivieramaya
          retention-days: 1
      - name: Upload dist-tulum
        uses: actions/upload-artifact@v4
        with:
          name: dist-tulum
          path: /tmp/region-builds/tulum
          retention-days: 1

  # 2. DEPLOY CLOUDFLARE PAGES — 6 regions matrix
  deploy-pages:
    name: Deploy Cloudflare Pages (6 regions)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        region: [mq, gp, florida, puntacana, rivieramaya, tulum]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download region build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.region }}
          path: dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wrangler
        run: npm install -g wrangler && echo "$(npm bin -g)" >> $GITHUB_PATH

      - name: Prepare region-specific data
        run: |
          echo "Preparing region ${{ matrix.region }}..."
          case "${{ matrix.region }}" in
            mq) PROJECT="sargagame" ;;
            gp) PROJECT="sargagame-gp" ;;
            florida) PROJECT="sargagame-florida" ;;
            puntacana) PROJECT="sargagame-puntacana" ;;
            rivieramaya) PROJECT="sargagame-rivieramaya" ;;
            tulum) PROJECT="sargagame-tulum" ;;
          esac
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV

      - name: Copy region-specific Copernicus data
        run: |
          mkdir -p dist/api/copernicus
          for F in sargassum.json history.json; do
            SRC="public/api/copernicus/${{ matrix.region }}/$F"
            if [ -f "$SRC" ]; then
              cp "$SRC" "dist/api/copernicus/$F"
              echo "  ✓ Copied ${{ matrix.region }}/$F"
            fi
          done
          # Free tier « Ma plage » : fc7/ public (1 fichier/plage, série 7 j réelle).
          # MQ/GP : fusion ROOT (slugs sentinelles) + RÉGION (mq###/gp###) — ids disjoints.
          RID="${{ matrix.region }}"
          FCDIR="dist/api/copernicus/fc7"
          rm -rf "$FCDIR"; mkdir -p "$FCDIR"
          if [ "$RID" = "mq" ] || [ "$RID" = "gp" ]; then
            [ -d "public/api/copernicus/fc7" ] && cp -r "public/api/copernicus/fc7/." "$FCDIR/"
          fi
          [ -d "public/api/copernicus/$RID/fc7" ] && cp -r "public/api/copernicus/$RID/fc7/." "$FCDIR/"
          echo "  ✓ fc7 fusionné: $(ls "$FCDIR" | wc -l) fichiers"

      - name: Deploy to Cloudflare Pages
        run: |
          echo "Deploying ${{ env.PROJECT }}..."
          npx wrangler pages deploy dist --project-name=${{ env.PROJECT }} --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MOLLIE_WEBHOOK_SECRET: ${{ secrets.MOLLIE_WEBHOOK_SECRET }}

  # 3. DEPLOY WORKERS — all workers in parallel
  deploy-workers:
    name: Deploy Workers (sg-payments, supabase-proxy, b2b-api)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        worker:
          - sg-payments
          - supabase-proxy
          - b2b-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: |
          cd workers/${{ matrix.worker }}
          if [ -f index.ts ]; then
            npx tsc --noEmit --skipLibCheck index.ts 2>&1 || true
          elif [ -f index.js ]; then
            node --check index.js
          fi

      - name: Deploy worker
        run: |
          echo "Deploying ${{ matrix.worker }}..."
          npx wrangler deploy
        working-directory: workers/${{ matrix.worker }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MOLLIE_API_KEY: ${{ secrets.MOLLIE_API_KEY }}
          MOLLIE_WEBHOOK_SECRET: ${{ secrets.MOLLIE_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

  # 4. HEALTH CHECK — verify all endpoints respond
  health-check:
    name: Health Check (All 6 Domains)
    needs: [deploy-pages, deploy-workers]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        domain:
          - sargasses-martinique.com
          - sargasses-guadeloupe.com
          - sargassummiami.com
          - sargassumpuntacana.com
          - sargassumcancun.com
          - sargazotulum.com
    steps:
      - name: Health check domain
        run: |
          echo "Checking https://${{ matrix.domain }}/..."
          for i in 1 2 3; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "https://${{ matrix.domain }}/")
            if [ "$CODE" = "200" ]; then
              echo "✅ ${{ matrix.domain }} — 200 OK"
              exit 0
            fi
            echo "⚠️ Attempt $i: got $CODE, retrying in 5s..."
            sleep 5
          done
          echo "❌ ${{ matrix.domain }} — failed after 3 attempts"
          exit 1

      - name: Health check API endpoints
        run: |
          for EP in "/api/mollie-health" "/api/copernicus/forecast?region=martinique&days=1" "/_cron/drip"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "https://${{ matrix.domain }}${EP}")
            if [ "$CODE" = "200" ]; then
              echo "✅ ${{ matrix.domain }}${EP} — 200"
            else
              echo "⚠️ ${{ matrix.domain }}${EP} — got $CODE"
            fi
          done

  # 5. PURGE CACHE — Cloudflare CDN purge post-deploy (2-4 min target)
  purge-cache:
    name: Purge Cache (All 6 Zones)
    needs: [deploy-pages, deploy-workers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Purge all zones
        run: |
          ZONES="0d79f522fecdc36cdd27d88c91acfaee 5f9ea6d6042d60fb7b562bfe793e1a8c 7e4289282dcaffd5c65b9bac03c39bec 181cc2861f83ce426c22c2a7fe275a96 f83a729f298b70a42b0e41dbae8383ca 89397490a67e4c69c1f788b6ad9ba164"
          for ZONE in $ZONES; do
            echo "Purging $ZONE..."
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE/purge_cache" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"purge_everything":true}' | grep -q '"success":true' && echo "✅ $ZONE purged" || echo "⚠️ $ZONE purge failed (check token perms)"
          done

  # 6. NOTIFY — success/failure summary
  notify:
    name: Notify Deploy Result
    needs: [health-check, purge-cache]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Deploy status
        run: |
          if [ "${{ needs.health-check.result }}" = "success" ]; then
            echo "🚀 DEPLOY SUCCESS — all 6 domains live!"
            echo "📦 Bundle: ${{ needs.build.outputs.bundle_size }} bytes"
            echo "🏷️ Version: ${{ needs.build.outputs.version }}"
            echo "✅ All 6 domains healthy"
          else
            echo "❌ DEPLOY FAILED — check workflow logs"
            echo "🔍 Failed job: ${{ needs.health-check.result }}"
            exit 1
          fi