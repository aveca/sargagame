name: Outreach 0-PC (Worker automation)

# CI + deploy du Worker outreach (cold email B2B + posts Facebook).
# AUCUN envoi réel en CI : les tests mockent Resend/Meta/Supabase.
# En prod, les kill switches sont OFF + dry-run ON par défaut (wrangler.toml)
# → le premier deploy n'envoie strictement rien.

on:
  push:
    branches: [main]
    paths:
      - 'workers/outreach/**'
      - 'scripts/tests/outreach-queue.test.cjs'
      - 'supabase/schema.sql'
      - '.github/workflows/outreach.yml'
  pull_request:
    branches: [main]
    paths:
      - 'workers/outreach/**'
      - 'scripts/tests/outreach-queue.test.cjs'
      - '.github/workflows/outreach.yml'
  workflow_dispatch:

concurrency:
  group: outreach-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Outreach contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Syntax check (worker + test)
        run: |
          node --check workers/outreach/index.js
          node --check scripts/tests/outreach-queue.test.cjs
      - name: Outreach contract tests (36 assertions, 100 % mocké)
        run: node scripts/tests/outreach-queue.test.cjs

  deploy:
    name: Deploy outreach worker
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy worker (cron + routes workers.dev, secrets déjà provisionnés)
        run: npx wrangler deploy 2>&1 | tee /tmp/wrangler-deploy.log; test ${PIPESTATUS[0]} -eq 0
        working-directory: workers/outreach
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test (public, sans secret, sans envoi)
        run: |
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/wrangler-deploy.log | head -1 || true)
          if [ -z "$URL" ]; then echo "URL worker introuvable dans le log — smoke skippé (vérifier à la main)."; exit 0; fi
          echo "Worker URL: $URL"
          # /health = public, aucun PII, aucun envoi ; /status exige ADMIN_KEY (non testé ici).
          curl -fsS --max-time 20 "$URL/health" | tee /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          grep -q '"dry_run":true' /tmp/health.json || { echo "DANGER: dry_run pas actif par défaut"; exit 1; }
          echo "Smoke OK : worker répond, dry-run actif par défaut."
