name: Live Production Sentinel

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: live-production-sentinel
  cancel-in-progress: false

jobs:
  sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Capture bounded Cloudflare Worker error tail
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/sg-tail
          for worker in sargagame-mq sargagame-gp sargagame-florida sargagame-puntacana sargagame-rivieramaya; do
            echo "::group::wrangler tail $worker"
            timeout 35s npx --yes wrangler@latest tail "$worker" --format=json --status=error --sampling-rate=1 > "/tmp/sg-tail/${worker}.jsonl" 2>&1
            code=$?
            echo "tail_exit_code=$code"
            echo "::endgroup::"
            if [ "$code" != "0" ] && [ "$code" != "124" ]; then
              echo "TAIL_COMMAND_ERROR=$worker exit=$code" >> /tmp/sg-tail/tail-errors.txt
            fi
          done

      - name: Scan production and automation evidence
        id: scan
        shell: bash
        run: |
          set +e
          SG_TAIL_DIR=/tmp/sg-tail node scripts/autopilot/live-production-sentinel.cjs --skip-local
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open or update deduplicated live incident
        if: steps.scan.outputs.rc != '0' || hashFiles('tail-errors.txt') != ''
        shell: bash
        run: |
          report=".ai/autopilot/observations/live-production-latest.json"
          title="[LIVE-INCIDENT] sentinel-${{ github.run_id }}"
          if [ -f "$report" ]; then
            fp=$(node -e "const x=require('./$report'); console.log(x.fingerprint)")
            title="[LIVE-INCIDENT] $fp"
            body=$(node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('$report','utf8')); console.log('## Autonomous live incident\\n\\n'+JSON.stringify(x,null,2).slice(0,12000))")
          else
            body="## Autonomous live incident\n\nSentinel report missing. Check workflow logs and Cloudflare tail permissions."
          fi
          if [ -f /tmp/sg-tail/tail-errors.txt ]; then
            body="$body\n\n### Wrangler tail command errors\n\n$(cat /tmp/sg-tail/tail-errors.txt)"
          fi
          existing=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\"" --limit 1 --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$existing" ]; then
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body" --label "autopilot-live" 2>/dev/null || gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          else
            gh issue comment -R "$GITHUB_REPOSITORY" "$existing" --body "$body"
          fi

      - name: Upload sentinel evidence
        uses: actions/upload-artifact@v4
        with:
          name: live-production-sentinel-${{ github.run_id }}
          path: |
            .ai/autopilot/observations/live-production-latest.json
            /tmp/sg-tail/*
          if-no-files-found: warn
          retention-days: 7

      - name: Fail when live incident detected
        if: steps.scan.outputs.rc != '0' || hashFiles('tail-errors.txt') != ''
        run: |
          echo "::error::Live production incident detected; evidence and a deduplicated GitHub issue were created."
          exit 1
