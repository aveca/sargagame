name: Live Production Sentinel

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: live-production-sentinel
  cancel-in-progress: false

jobs:
  sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Capture bounded Cloudflare Worker error tail
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/sg-tail
          : > /tmp/sg-tail/tail-errors.txt
          : > /tmp/sg-tail/tail-status.txt
          # Run all six tails concurrently so the six 35s bounds do not add up
          # and starve the 6-domain HTTP/freshness checks under the 8-minute job cap.
          for worker in sargagame-mq sargagame-gp sargagame-florida sargagame-puntacana sargagame-rivieramaya sargagame-tulum; do
            (
              timeout 35s npx --yes wrangler@latest tail "$worker" --format=json --status=error  > "/tmp/sg-tail/${worker}.jsonl" 2>&1
              code=$?
              echo "$worker=$code" >> /tmp/sg-tail/tail-status.txt
              if [ "$code" != "0" ] && [ "$code" != "124" ]; then
                echo "TAIL_COMMAND_ERROR=$worker exit=$code" >> /tmp/sg-tail/tail-errors.txt
              fi
            ) &
          done
          wait
          cat /tmp/sg-tail/tail-status.txt
          if [ -s /tmp/sg-tail/tail-errors.txt ]; then cat /tmp/sg-tail/tail-errors.txt; fi

      - name: Scan production and automation evidence
        id: scan
        shell: bash
        run: |
          set +e
          SG_TAIL_DIR=/tmp/sg-tail node scripts/autopilot/live-production-sentinel.cjs --skip-local
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open or update deduplicated live incident
        # Uniquement sur incident LIVE confirmé (rc!=0). L'échec du tail wrangler
        # (sonde sensor) ne doit plus créer ni déclencher un incident live — ces
        # erreurs visent le log d'audit, jamais un incident de production.
        if: steps.scan.outputs.rc != '0'
        shell: bash
        run: |
          report=".ai/autopilot/observations/live-production-latest.json"
          title="[LIVE-INCIDENT] sentinel-${{ github.run_id }}"
          if [ -f "$report" ]; then
            fp=$(node -e "const x=require('./$report'); console.log(x.fingerprint)")
            title="[LIVE-INCIDENT] $fp"
            body=$(node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('$report','utf8')); console.log('## Autonomous live incident\\n\\n'+JSON.stringify(x,null,2).slice(0,12000))")
            # Anti-recyclage : une issue existante n'est acceptée comme incident
            # courant que si sa dernière mise à jour est récente (48h). Une
            # empreinte obsolète reçoit une NOUVELLE issue (suffixe de date) au
            # lieu de rouvrir l'incident ancien.
            existing=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\"" --limit 1 --json number --jq '.[0].number' 2>/dev/null || true)
            if [ -n "$existing" ]; then
              updatedAt=$(gh issue view -R "$GITHUB_REPOSITORY" "$existing" --json updatedAt --jq '.updatedAt' 2>/dev/null || true)
              if [ -n "$updatedAt" ]; then
                ageH=$(( ( $(date +%s) - $(date -d "$updatedAt" +%s) ) / 3600 ))
                if [ "$ageH" -gt 48 ]; then
                  echo "::note::empreinte $fp existante sur l'issue #$existing mais périmée (${ageH}h) — nouvelle issue au lieu de recyclage"
                  title="$title-recharge-$(date -u +%Y%m%d)"
                  existing=""
                fi
              fi
            fi
          else
            body="## Autonomous live incident — NOT_PROVEN\n\nLe rapport du sentinel est manquant (.ai/autopilot/observations/live-production-latest.json absent). Aucun incident live n'est prouvé par cette exécution ; conserver la sonde. Cause technique et étape : scanner (run ci-dessus)."
          fi
          if [ -z "$existing" ]; then
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body" --label "autopilot-live" 2>/dev/null || gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          else
            gh issue comment -R "$GITHUB_REPOSITORY" "$existing" --body "$body"
          fi

      - name: Upload sentinel evidence
        uses: actions/upload-artifact@v4
        with:
          name: live-production-sentinel-${{ github.run_id }}
          path: |
            .ai/autopilot/observations/live-production-latest.json
            /tmp/sg-tail/*
          if-no-files-found: warn
          retention-days: 7

      - name: Fail when live incident detected
        # Uniquement sur incident LIVE confirmé (rc!=0). L'échec de la sonde
        # (tail manquant ou permissions) n'est plus un incident de production ;
        # il est rapporté NOT_PROVEN (cause visible dans le log, jamais masqué).
        if: steps.scan.outputs.rc != '0'
        run: |
          echo "::error::Live production incident detected; evidence and a deduplicated GitHub issue were created."
          exit 1
