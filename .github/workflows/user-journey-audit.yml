name: User Journey Audit (E2E #41)

# Mission #41 (factory-control) : parcours utilisateurs réels sur les 6 domaines
# de la matrice officielle — home → plage → fiche (verdict + fraîcheur) → retour,
# desktop + mobile, console/erreurs capturées, rapport dédupliqué.
# Complète le smoke HTTP du Sentinel (10 min) et le rapport UX hebdomadaire.

on:
  schedule:
    - cron: '30 */4 * * *' # décalé des autres crons (00:30, 04:30, …)
  workflow_dispatch:
  workflow_run:
    workflows:
      - Cloudflare Production
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  issues: write

concurrency:
  group: user-journey-audit
  cancel-in-progress: true

jobs:
  journeys:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run user journeys (6 domains, desktop + mobile)
        run: node scripts/automation/user-journey-audit.cjs --out user-journey-report.json

      - name: Summary
        if: always()
        run: |
          node -e "const fs=require('fs');if(fs.existsSync('user-journey-report.json')){const r=JSON.parse(fs.readFileSync('user-journey-report.json','utf8'));let s='## User journeys (E2E #41)\n\nRuns: '+r.summary.runs+' · Defects: '+r.summary.defects+' (blocking '+r.summary.blocking+', ux '+r.summary.ux+')\n\n| Domaine | Viewport | Étapes |\n|---|---|---|\n';for(const run of r.runs)s+='| '+run.domain+' | '+run.viewport+' | '+run.steps.map(x=>x.step+(x.ok?' ✓':' ✗')).join(' > ')+' |\n';if(r.defects.length)s+='\n### Défauts\n'+r.defects.map(d=>'- ['+d.type+'] '+d.domain+' '+d.step+' — '+d.detail).join('\n');fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,s)}"

      - name: Notify defects and hand off eligible repair
        if: always() && hashFiles('user-journey-report.json') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FACTORY_CONTROL_TOKEN: ${{ secrets.FACTORY_CONTROL_TOKEN }}
        run: node scripts/automation/user-journey-notify.cjs --report user-journey-report.json
      - name: Upload report + screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: user-journey-${{ github.run_id }}
          path: |
            user-journey-report.json
            user-journey-notification.json
            scripts/automation/data/journeys/
          if-no-files-found: ignore
          retention-days: 30

      # Défauts bloquants => échec explicite (jamais silencieux). Les défauts UX
      # non bloquants restent dans le rapport/summary sans casser le run.
      - name: Fail on blocking defects
        if: always()
        run: |
          node -e "const fs=require('fs');if(!fs.existsSync('user-journey-report.json')){console.error('rapport absent');process.exit(1)};const r=JSON.parse(fs.readFileSync('user-journey-report.json','utf8'));if(r.summary.blocking>0){console.error(''+r.summary.blocking+' défaut(s) bloquant(s) : parcours visiteur cassé');process.exit(1)};console.log('0 défaut bloquant')"
