name: CI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Run tests (*.test.cjs)
        run: npm test
      - name: Verify Build
        run: npm run build
      - name: Check bundle budget (JS eager Ôëñ 210 Ko gzip)
        run: node scripts/check-bundle-budget.cjs
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Start Vite preview (build output)
        run: |
          nohup npx vite preview --port 4173 --host 127.0.0.1 > /tmp/vite-preview.log 2>&1 &
          echo $! > /tmp/vite-preview.pid
      - name: Wait for preview server ready
        run: |
          for i in {1..30}; do
            if curl -fs http://127.0.0.1:4173 >/dev/null; then echo "Preview server ready"; exit 0; fi
            sleep 1
          done
          echo "Preview server failed to start"
          cat /tmp/vite-preview.log
          exit 1
      - name: Run UX smoke test (mobile funnel)
        run: node scripts/ux-smoke.mjs | tee /tmp/smoke.log
      - name: Verify smoke tokens
        run: |
          grep -q 'FUNNEL_REACHED=map+fiche+paywall' /tmp/smoke.log
          grep -q 'ERRORS=\[\]' /tmp/smoke.log
          grep -q 'WHITE_OR_TRANSPARENT_BUTTONS=\[\]' /tmp/smoke.log
          grep -q 'RM_INFINITE=\[\]' /tmp/smoke.log
