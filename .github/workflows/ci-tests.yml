name: CI Tests

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Déclenchement manuel : utilisé par le workflow de rafraîchissement des
  # données pour produire le check `test-frontend` SUR LE SHA EXACT qui sera
  # déployé. Un commit créé par GITHUB_TOKEN ne déclenche aucun workflow
  # `push` : sans ce déclencheur, la porte de certification n'aurait aucune
  # preuve CI pour ce SHA et refuserait systématiquement le déploiement.
  workflow_dispatch:

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Verify Build
        run: npm run build
      # Exécute le vrai packaging avant les tests : chaque répertoire configuré comme
      # assets Wrangler doit transporter .assetsignore et ses exclusions de sécurité.
      - name: Prepare MQ/GP packages and verify Worker asset exclusions
        run: node scripts/prepare-ftp.cjs
      - name: Run tests (*.test.cjs)
        run: npm test
      # CONTRÔLE A (gouvernance) — intégrité du mécanisme de certification :
      # vocabulaire des statuts strict, attestations cohérentes (nom == cible),
      # aucune valeur inconnue/ambiguë. TOLÈRE NOT_PROVEN (une réparation de
      # gouvernance doit pouvoir merger) ; ne vérifie pas les preuves métier —
      # c'est le rôle du Contrôle B (--mode deploy) appliqué aux déploiements.
      - name: Certification integrity (Contrôle A — PR)
        run: node scripts/CHECK_certification_status.cjs --mode pr
      # Audits de câblage (composants scripts/autopilot/) — les issues bloquent,
      # les warnings restent visibles. Empêche une régression débranchant le
      # gate de certification ou les vérifications de déploiement.
      - name: Governance wiring audits (ci-certification-audit + deploy-audit)
        run: |
          node scripts/autopilot/ci-certification-audit.cjs
          node scripts/autopilot/deploy-audit.cjs
      # Garde-fou de non-régression du DÉCLENCHEMENT du parcours de production.
      # Bloque la réintroduction d'une branche de développement dans
      # `on.push.branches` du workflow Cloudflare Production : la porte de
      # certification exige `test-frontend` + `perf` sur le SHA exact, checks
      # produits uniquement sur `main` — d'où 10 échecs identiques (run
      # 39383768675, SHA 4eea0367, branche agent/coding/TASK-P1-002).
      - name: Production trigger scope guard
        run: node scripts/check-production-trigger-scope.cjs
      - name: GitHub Actions runtime and pinning policy
        run: node scripts/autopilot/check-github-actions-policy.cjs
      - name: Check bundle budget (JS eager ≤ 210 Ko gzip)
        run: node scripts/check-bundle-budget.cjs
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Start Vite preview (build output)
        run: npx vite preview --port 4173 --host &
      - name: Wait for preview server ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:4173 >/dev/null; then echo "Preview server ready"; exit 0; fi
            sleep 2
          done
          echo "Preview server failed to start"
          exit 1
      - name: Run UX smoke test (mobile funnel)
        run: node scripts/ux-smoke.mjs | tee /tmp/smoke.log
      - name: Verify smoke tokens
        run: |
          grep -q 'FUNNEL_REACHED=map+fiche+paywall' /tmp/smoke.log
          grep -q 'ERRORS=\[\]' /tmp/smoke.log
          grep -q 'WHITE_OR_TRANSPARENT_BUTTONS=\[\]' /tmp/smoke.log
          grep -q 'RM_INFINITE=\[\]' /tmp/smoke.log
      - name: Run B2B reliability freshness browser test
        run: node scripts/track-record-pricing-smoke.mjs
      - name: Run HomeAZ freshness visual and interaction regression
        run: node scripts/homeaz-freshness-smoke.mjs
      - name: Upload HomeAZ freshness screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homeaz-freshness-visual-check
          path: /tmp/homeaz-freshness/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Upload B2B reliability before/after screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: b2b-track-record-pricing-visual-check
          path: /tmp/track-record-pricing/*.png
          if-no-files-found: warn
          retention-days: 7
