name: Factory Runner Syntax Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/factory-runner-smoke.yml"
      - ".github/workflows/factory-cloud-runner.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@latest
      - name: Validate the cloud runner workflow
        run: "$(go env GOPATH)/bin/actionlint" -color .github/workflows/factory-cloud-runner.yml
      - name: Prove workflow parser is operational
        run: echo "Smoke workflow parsed and actionlint executed"
