name: Daily Copernicus + Deploy

on:
  schedule:
    # Refresh 4x/day; persist one canonical daily-metrics snapshot at 18:00 UTC (14:00 MQ).
    - cron: '0 0 * * *'
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'AGENTS.md'
      - '.github/workflows/daily-copernicus.yml'
      - '.github/workflows/cloudflare-production.yml'

# Gating par événement — un push de code doit être RAPIDE :
#   • push            → build des 6 régions + health-check UNIQUEMENT.
#                       Pas de vidéo ffmpeg, pas d'emails, pas de fetch data,
#                       pas de submit SEO, pas de commit.
#   • schedule        → data fetch + email automation + health-check.
#                       Build/deploy délégué à cloudflare-production.yml.
#   • workflow_dispatch → comme schedule MAIS sans les envois email
#                       ni la vidéo : refresh data + health-check à la demande.
# Le deploy est géré par cloudflare-production.yml (Workers + Pages).

permissions:
  contents: write
  # `actions: write` autorise le dispatch de la chaîne CI + production après la
  # publication des données (le push est fait avec le GITHUB_TOKEN, or un push
  # GITHUB_TOKEN ne déclenche aucun workflow `push`).
  actions: write

# Sérialise les runs sur main pour éliminer les conflits rebase
concurrency:
  group: daily-copernicus-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. DATA FETCH (rapide, < 5 min) ────────────────────────────────────────
  fetch-data:
    outputs:
      publication_status: ${{ steps.publication_status.outputs.status }}
      gate_outcome: ${{ steps.verify.outcome }}
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Parité régions ↔ webhook (paiements)
        run: node -e "require('./regions/index.cjs').assertAllRegionsValid()"

      - name: Fetch beach weather (Open-Meteo)
        continue-on-error: true
        run: node scripts/fetch-beach-weather.cjs

      - name: Fetch LIVE sargassum data from ERDDAP
        id: erddap
        continue-on-error: true
        run: node scripts/fetch-sargassum-live.cjs

      - name: Report source
        id: src
        run: |
          if [ -f public/api/copernicus/sargassum.json ]; then
            SOURCE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('public/api/copernicus/sargassum.json','utf-8')).source)")
            UPDATED=$(node -e "console.log(JSON.parse(require('fs').readFileSync('public/api/copernicus/sargassum.json','utf-8')).updatedAt)")
          else
            SOURCE=none; UPDATED=n/a
          fi
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE updatedAt=$UPDATED"

      - name: Gate intégrité (refuse source dégradée / pic tout-vert)
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node scripts/verify-ftp-ready.cjs 2>&1 | tee "$RUNNER_TEMP/verify-ftp-ready.log"
          rc=${PIPESTATUS[0]}
          if grep -q 'observation hors SLA' "$RUNNER_TEMP/verify-ftp-ready.log"; then
            echo "gate_status=BLOCKED_STALE_SOURCE" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -ne 0 ]; then
            echo "gate_status=FAILED_VALIDATION" >> "$GITHUB_OUTPUT"
          else
            echo "gate_status=PASS" >> "$GITHUB_OUTPUT"
          fi
          exit "$rc"

      # The public B2B track record must be generated in THIS workspace, after
      # fresh archive/history are fetched and before the data commit/deploy.
      - name: Backtest forecast accuracy for public track record
        id: public_track_record_backtest
        if: steps.src.outputs.source != 'none' && steps.verify.outcome == 'success'
        continue-on-error: true
        run: node scripts/automation/backtest-forecast.cjs

      - name: Build public track record before publication
        id: public_track_record_build
        if: steps.public_track_record_backtest.outcome == 'success'
        continue-on-error: true
        run: node scripts/automation/build-track-record.cjs

      - name: Mark existing track record stale if regeneration fails
        if: steps.src.outputs.source != 'none' && (steps.verify.outcome != 'success' || steps.public_track_record_backtest.outcome != 'success' || steps.public_track_record_build.outcome != 'success')
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'public/api/copernicus/track-record.json';
          if (!fs.existsSync(file)) {
            console.warn('No existing track-record artifact to mark stale; no forecast metrics created.');
            process.exit(0);
          }
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          data.freshness = {
            ...(data.freshness || {}),
            stale: true,
            failureReason: 'Data integrity gate, backtest, or track-record build failed in the current publication run'
          };
          fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
          console.warn('Existing track record marked stale; its metrics were not changed.');
          NODE

      - name: Commit + push des données Copernicus
        id: publish
        if: steps.src.outputs.source != 'none'
        env:
          INTEGRITY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "$INTEGRITY_OUTCOME" != "success" ]; then
            # The integrity gate rejected this fetch: publish only the stale marker,
            # never the satellite payload that failed validation.
            if [ -f public/api/copernicus/track-record.json ]; then
              git add public/api/copernicus/track-record.json
            fi
          else
            git add public/api/copernicus/sargassum.json public/api/copernicus/history.json public/api/copernicus/sargassum-grid.json public/api/copernicus/sargassum-banks.json 2>/dev/null || true
            for f in climatology.json forecast-archive.json track-record.json citizen-accuracy.json sentinel2-nearshore.json sentinel2-history.json sentinel2-calibration.json; do
              if [ -f "public/api/copernicus/$f" ]; then git add "public/api/copernicus/$f"; fi
            done
            if [ -f public/api/weather/beaches-weather.json ]; then git add public/api/weather/beaches-weather.json; fi
            if [ -f public/api/copernicus/_private/forecast-full.json ]; then git add public/api/copernicus/_private/forecast-full.json; fi
            for p in public/api/copernicus/*/_private/forecast-full.json; do
              if [ -f "$p" ]; then git add "$p"; fi
            done
            for pat in sargassum.json history.json sargassum-banks.json sargassum-grid.json forecast-archive.json; do
              git add "public/api/copernicus/*/$pat" 2>/dev/null || true
            done
          fi
          if git diff --cached --quiet; then
            echo "Aucune donnée à commit (déjà à jour)."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(data): refresh Copernicus $(date -u +'%Y-%m-%d %H:%M UTC')"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          BRANCH="${GITHUB_REF_NAME:-main}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          push_ok=0
          for i in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git stash --include-untracked || true
            if ! git rebase -X theirs "origin/$BRANCH"; then
              echo "::warning::git rebase -X theirs échoué (tentative $i/5)"
              git rebase --abort || true
              sleep 10
              continue
            fi
            # Idempotence (exécutions concurrentes schedule/dispatch/veilleurs) :
            # comparer l'arbre complet après rebase, pas seulement les quatre
            # fichiers satellite : un run concurrent peut avoir les mêmes
            # entrées satellite mais un track-record.json différent.
            if git diff --quiet "origin/$BRANCH" HEAD --; then
              echo "Données déjà publiées par une exécution concurrente — publication acquise."
              push_ok=1
              git stash pop || true
              break
            fi
            if git push origin "HEAD:$BRANCH"; then
              push_ok=1
              echo "git push OK (tentative $i)"
              break
            fi
            echo "::warning::git push échoué (tentative $i/5), pause 20s"
            git stash pop || true
            sleep 20
          done
          if [ "$push_ok" != "1" ]; then
            echo "::error::git push a échoué après 5 tentatives"
            exit 1
          fi
          # NOTE (2026-10-13) : aucun dispatch explicite ici — voir data-refresh.yml
          # (GITHUB_TOKEN => 403 systématique ; publication couverte par le cron
          # et les triggers push du workflow de production).
          # RÉVISÉ (2026-10-20) : le push GITHUB_TOKEN ne déclenche AUCUN workflow
          # `push` — le step « Déclenche la chaîne CI + déploiement » (ajouté
          # plus bas) dispatche explicitement `ci-tests.yml`, `perf-budget.yml`
          # puis `cloudflare-production.yml`, la porte de certification exigeant
          # `test-frontend` + `perf` verts sur le SHA exact déployé.

      # ── Déclenchement de la chaîne CI + déploiement ────────────────────────
      # Uniquement si la publication a réussi ET porte sur `main` : une
      # publication sur une branche de développement ne doit jamais déclencher
      # un déploiement de production.
      - name: Déclenche la chaîne CI + déploiement
        id: dispatch
        if: steps.publish.outcome == 'success' && steps.publish.outputs.branch == 'main' && steps.verify.outcome == 'success' && steps.erddap.outcome == 'success'
        env:
          # `GITHUB_TOKEN` n'est PAS une variable d'environnement par défaut
          # dans GitHub Actions : sans elle, l'API dispatch est refusée (le
          # script échoue explicitement, fail-closed). C'est ce qui a fait
          # échouer le premier essai en CI (run 39406923824).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEPLOY_REF: main
        run: node scripts/automation/trigger-production-deploy.cjs

      - name: Alerte — données non publiées
        if: steps.verify.outcome == 'failure'
        run: echo "::error title=Data refresh bloquée::verify-ftp-ready a refusé la publication."

      - name: Report publication status
        id: publication_status
        if: always()
        env:
          SOURCE: ${{ steps.src.outputs.source }}
          ERDDAP_OUTCOME: ${{ steps.erddap.outcome }}
          GATE_OUTCOME: ${{ steps.verify.outcome }}
          GATE_STATUS: ${{ steps.verify.outputs.gate_status }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          PUBLISH_CHANGED: ${{ steps.publish.outputs.changed }}
          PUBLISH_SHA: ${{ steps.publish.outputs.sha }}
          PUBLISH_BRANCH: ${{ steps.publish.outputs.branch }}
          DISPATCH_OUTCOME: ${{ steps.dispatch.outcome }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          let payload = {};
          try { payload = JSON.parse(fs.readFileSync('public/api/copernicus/sargassum.json', 'utf8')); } catch {}
          const sourceTimestamp = typeof payload.erddapTimestamp === 'string' ? payload.erddapTimestamp : null;
          const sourceMs = sourceTimestamp ? Date.parse(sourceTimestamp) : NaN;
          const nowMs = Date.now();
          const sourceTimestampValid = Number.isFinite(sourceMs) && sourceMs <= nowMs;
          const sourceAgeMinutes = sourceTimestampValid ? Math.floor((nowMs - sourceMs) / 60000) : null;
          const gateStatus = process.env.GATE_STATUS || 'UNCLASSIFIED';
          const publishChanged = process.env.PUBLISH_CHANGED === 'true'
            ? true
            : process.env.PUBLISH_CHANGED === 'false' ? false : null;
          const { classifyPublicationStatus } = require('./scripts/lib/copernicus-publication-status.cjs');
          const status = classifyPublicationStatus({
            gateStatus,
            erddapOutcome: process.env.ERDDAP_OUTCOME,
            source: process.env.SOURCE,
            gateOutcome: process.env.GATE_OUTCOME,
            publishOutcome: process.env.PUBLISH_OUTCOME,
            publishChanged
          });
          let changedPayloadFiles = [];
          try {
            const sha = process.env.PUBLISH_SHA;
            const raw = sha
              ? execFileSync('git', ['show', '--format=', '--name-only', sha], { encoding: 'utf8' })
              : execFileSync('git', ['diff', '--name-only', 'HEAD', '--', 'public/api/copernicus/'], { encoding: 'utf8' });
            changedPayloadFiles = raw.split(/\r?\n/).map(x => x.trim()).filter(x => x.startsWith('public/api/copernicus/'));
          } catch {}
          const report = {
            generatedAt: new Date(nowMs).toISOString(),
            status,
            source: process.env.SOURCE || null,
            erddapFetchOutcome: process.env.ERDDAP_OUTCOME || null,
            erddapTimestamp: sourceTimestamp,
            sourceTimestampValid,
            sourceAgeMinutes,
            operationalSlaMinutes: 900,
            publicStaleThresholdMinutes: 2160,
            publicStale: sourceTimestampValid ? sourceAgeMinutes >= 2160 : null,
            integrityGateOutcome: process.env.GATE_OUTCOME || null,
            integrityGateClassification: gateStatus,
            publishOutcome: process.env.PUBLISH_OUTCOME || null,
            publishChanged,
            publishBranch: process.env.PUBLISH_BRANCH || null,
            commitSha: process.env.PUBLISH_SHA || null,
            deploymentDispatchOutcome: process.env.DISPATCH_OUTCOME || 'unknown',
            changedPayloadFiles,
            changedPayloadFields: null,
            payloadFieldComparison: 'NOT_PERFORMED_BY_WORKFLOW_STATUS_PATCH',
            sourceTimestampAdvancedAgainstLive: null
          };
          const out = process.env.RUNNER_TEMP + '/copernicus-publication-status.json';
          fs.writeFileSync(out, JSON.stringify(report, null, 2) + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'status=' + status + '\n' + 'gate_outcome=' + (process.env.GATE_OUTCOME || 'unknown') + '\n');
          const summary = [
            '## Copernicus publication status: ' + status,
            '',
            '- Source: ' + (report.source || 'unknown'),
            '- ERDDAP fetch: ' + report.erddapFetchOutcome,
            '- Observation timestamp: ' + (sourceTimestamp || 'UNVERIFIED'),
            '- Computed candidate age (minutes): ' + (sourceAgeMinutes === null ? 'UNVERIFIED' : sourceAgeMinutes),
            '- Operational SLA: 900 minutes',
            '- Public stale threshold: 2160 minutes',
            '- Integrity gate: ' + report.integrityGateOutcome + ' (' + gateStatus + ')',
            '- Publish outcome: ' + report.publishOutcome,
            '- Commit changes detected: ' + (publishChanged === null ? 'UNVERIFIED' : publishChanged),
            '- Commit SHA: ' + (report.commitSha || 'none'),
            '- Deploy dispatch: ' + report.deploymentDispatchOutcome,
            '- Changed payload files: ' + (changedPayloadFiles.length ? changedPayloadFiles.join(', ') : 'none detected'),
            '- Field-level payload comparison: NOT PERFORMED by this status-only change',
            '- Source timestamp advancement against live: NOT VERIFIED'
          ].join('\n') + '\n';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          console.log(JSON.stringify(report, null, 2));
          if (['BLOCKED_STALE_SOURCE', 'FAILED_VALIDATION', 'FAILED_PUBLISH'].includes(status)) {
            console.error('Copernicus publication status is ' + status);
            process.exit(1);
          }
          NODE

      - name: Upload publication status evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copernicus-publication-status-${{ github.run_id }}
          path: ${{ runner.temp }}/copernicus-publication-status.json
          if-no-files-found: error
          retention-days: 7

  # ── 2. EMAIL AUTOMATION (parallèle, non-bloquant) ──────────────────────────
  email-automation:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # 24 étapes réseau en série : le job tourne normalement ~28 min. Le budget
    # était de 30 min — trop juste : un seul appel bloqué annulait le job, donc
    # le RUN entier (`cancelled`), donc les étapes suivantes. Marge +
    # timeouts d'étape : un blocage devient un échec d'étape TOLÉRÉ, pas
    # l'annulation de la chaîne.
    timeout-minutes: 45
    continue-on-error: true
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      - name: Push win-back dormant users
        env:
          ONESIGNAL_API_KEY_MQ: ${{ secrets.ONESIGNAL_API_KEY_MQ }}
          ONESIGNAL_API_KEY_GP: ${{ secrets.ONESIGNAL_API_KEY_GP }}
        run: node scripts/automation/push-winback.cjs --send

      - name: Clean bounced emails from Sheet
        run: |
          echo "Calling clean_bounces on Apps Script..."
          RESULT=$(curl -sL --max-time 30 "https://script.google.com/macros/s/AKfycbwkV1tQSEmrZ_zFPcIHBXh1EidFy16z72lx6ztABtVp4Ae3AikFHeGwN6JFMccbpoU07w/exec?action=clean_bounces")
          echo "Result: $RESULT"

      - name: Fetch subscriber list
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/automation/fetch-subscribers.cjs

      - name: Build payers segment
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/automation/fetch-payers.cjs

      - name: Send incident apologies (if any pending)
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: node scripts/automation/incident-apology.cjs

      - name: Health check (uptime monitoring + staleness alerts)
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: node scripts/automation/health-check.cjs

      - name: Aggregate observed climatology (honest season trend)
        if: github.event_name != 'push'
        continue-on-error: true
        run: node scripts/automation/aggregate-climatology.cjs

      - name: Check email delivery stats (opens, clicks, bounces)
        if: github.event_name != 'push'
        continue-on-error: true
        run: node scripts/automation/check-email-status.cjs

      - name: Daily stats check (metrics + trend detection)
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID_MQ: ${{ secrets.GA4_PROPERTY_ID_MQ }}
          GA4_PROPERTY_ID_GP: ${{ secrets.GA4_PROPERTY_ID_GP }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          MOLLIE_API_KEY: ${{ secrets.MOLLIE_API_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/automation/daily-stats-check.cjs

      - name: Revenue watch (alerte mouvements Stripe)
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: node scripts/automation/revenue-watch.cjs --send

      - name: Mollie MRR tracker
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          MOLLIE_API_KEY: ${{ secrets.MOLLIE_API_KEY }}
        run: node scripts/automation/mollie-mrr.cjs --send

      - name: UX watch (alerte criticals rage/dead-click)
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: node scripts/automation/ux-watch.cjs --send

      - name: Deliverability watch (alerte pic de rebonds)
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: node scripts/automation/deliverability-watch.cjs --send

      - name: Factory heartbeat watch (alerte usine locale silencieuse)
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/automation/factory-heartbeat-watch.cjs --send

      - name: Purge analytics_events (> 90j)
        if: github.event_name == 'schedule'
        continue-on-error: true
        # Budget d'étape : un blocage réseau ne doit plus consommer le budget
        # du JOB (30 min), car l'annulation du job ANNULAIT le run entier et
        # faisait sauter les étapes suivantes — dont « Commit email state »
        # (anti-doublon des envois). 157 runs `cancelled` en découlaient
        # (cause racine : boucle de purge sans condition d'arrêt, cf.
        # scripts/automation/purge-analytics.cjs). Un timeout d'ÉTAPE est
        #.fail-lourd mais TOLÉRÉ (continue-on-error ci-dessus) : le job
        # continue, le run reste vert.
        timeout-minutes: 10
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/automation/purge-analytics.cjs

      - name: Funnel from Supabase (complementary)
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/automation/funnel-from-supabase.cjs --days=7

      - name: Daily funnel report
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/automation/funnel-daily-report.cjs

      - name: UX daily tracking (diff jour-à-jour first-party)
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          SG_STATS_KEY: ${{ secrets.SG_STATS_KEY }}
          SG_STATS_KEY_MQ: ${{ secrets.SG_STATS_KEY_MQ }}
          SG_STATS_KEY_GP: ${{ secrets.SG_STATS_KEY_GP }}
          SG_STATS_KEY_FLORIDA: ${{ secrets.SG_STATS_KEY_FLORIDA }}
          SG_STATS_KEY_PUNTACANA: ${{ secrets.SG_STATS_KEY_PUNTACANA }}
          SG_STATS_KEY_RIVIERAMAYA: ${{ secrets.SG_STATS_KEY_RIVIERAMAYA }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: node scripts/automation/ux-daily.cjs --send

      - name: Publish daily metrics snapshot
        # Responsabilité SÉPARÉE du commit email (qui garde son continue-on-error
        # pour l'anti-doublon). PAS de continue-on-error ici : un échec définitif
        # de publication DOIT faire échouer le workflow. Une annotation ::error
        # sans code de sortie non nul ne suffisait pas.
        if: github.event_name == 'schedule' && github.event.schedule == '0 18 * * *'
        env:
          BRANCH: ${{ github.ref_name }}
        timeout-minutes: 10
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          M=scripts/automation/data/daily-metrics.json
          # GARDE d'exploitabilité (consolidation #1070 + #1071) : JSON valide,
          # non vide, porteur de clés de mesure. Formes acceptées : TABLEAU (le
          # fichier réel du dépôt en est un, de 13 éléments) ET OBJET — une garde
          # sur Object.keys() seul rendait les indices 0..12 d'un tableau.
          # Absent / null / vide / invalide / incomplet => on SAUTE : on ne
          # remplace JAMAIS une donnée valide par des zéros.
          if [ ! -f "$M" ] || ! node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));const o=Array.isArray(j)?(j[0]||{}):j;const k=Object.keys(o);if(!k.length)process.exit(3);const has=(...n)=>n.some(x=>k.some(z=>z.toLowerCase().includes(x.toLowerCase())));if(!has('funnel','stripe','sessions','paywall','count'))process.exit(4)" "$M"; then
            echo "::error title=Snapshot métrique non exploitable::$M absent, nul, vide, invalide ou sans clé de mesure — publication annulée (donnée valide préservée)."
            exit 1
          fi
          # IDEMPOTENCE : une seule publication par date UTC.
          LAST_COMMIT="$(git log -1 --format=%cI -- "$M" || true)"
          LAST_DAY=""
          if [ -n "$LAST_COMMIT" ]; then
            LAST_DAY="$(date -u -d "$LAST_COMMIT" +'%Y-%m-%d' 2>/dev/null || true)"
          fi
          TODAY_UTC="$(date -u +'%Y-%m-%d')"
          if [ "$LAST_DAY" = "$TODAY_UTC" ]; then
            echo "Snapshot déjà publié pour ${TODAY_UTC} — doublon évité."
            exit 0
          fi
          git add "$M"
          git commit -m "chore: daily metrics snapshot ${TODAY_UTC}" || echo "Rien à committer (snapshot inchangé)."
          # Les étapes précédentes génèrent aussi des rapports et états non commités.
          # Les isoler temporairement évite que git rebase refuse le worktree sale ;
          # ils sont restaurés avant le step séparé « Commit email state ».
          STASHED_GENERATED_CHANGES=0
          if [ -n "$(git status --porcelain)" ]; then
            git stash push --include-untracked -m "daily-metrics-snapshot-${GITHUB_RUN_ID:-local}"
            STASHED_GENERATED_CHANGES=1
          fi
          restore_generated_changes() {
            if [ "$STASHED_GENERATED_CHANGES" = "1" ]; then
              if ! git stash pop --index; then
                echo "::error::Impossible de restaurer les fichiers générés ; le stash reste conservé."
                return 1
              fi
              STASHED_GENERATED_CHANGES=0
            fi
          }
          push_ok=0
          for i in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            if ! git rebase -X theirs "origin/$BRANCH"; then
              echo "::warning::rebase échoué (tentative $i/5)"
              git rebase --abort || true
              sleep 10
              continue
            fi
            if git diff --quiet "origin/$BRANCH"; then
              echo "Snapshot déjà publié par une exécution concurrente — acquis."
              push_ok=1
              break
            fi
            if git push origin "HEAD:$BRANCH"; then
              push_ok=1
              echo "Snapshot publié (tentative $i)."
              break
            fi
            echo "::warning::push échoué (tentative $i/5), pause 20s"
            sleep 20
          done
          # Restaurer les sorties des étapes précédentes avant le commit email anti-doublon.
          restore_generated_changes
          # ÉCHEC DÉFINITIF : exit non nul (pas une simple annotation).
          if [ "$push_ok" != "1" ]; then
            echo "::error title=Publication du snapshot métrique échouée::push refusé après 5 tentatives — le workflow ÉCHOUE."
            exit 1
          fi
      - name: Commit email state (anti-doublon)
        if: github.event_name != 'push'
        continue-on-error: true
        # Étape critique : c'est elle qui fige l'anti-doublon des envois. Elle
        # ne doit JAMAIS être sautée par l'annulation d'une étape précédente.
        # `continue-on-error` reste volontaire ICI : l'email n'est pas critique.
        # La publication du snapshot métrique est une responsabilité SÉPARÉE
        # (step « Publish daily metrics snapshot` ci-dessous) car son échec
        # définitif DOIT faire échouer le workflow.
        timeout-minutes: 10
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in scripts/automation/data/welcome-sent.json scripts/automation/data/drip-sent.json scripts/automation/data/drip-b2b-sent.json scripts/automation/data/weekend-sent.json scripts/automation/data/bounced-emails.json scripts/automation/data/notifications-sent.json scripts/automation/data/welcome-paid-sent.json scripts/automation/data/dunning-sent.json scripts/automation/data/pass-expiry-winback-sent.json scripts/automation/data/cold-reengage-sent.json scripts/automation/data/weather-reengage-state.json scripts/automation/data/weather-reengage-sent.json scripts/automation/data/welcome-paid-mollie-sent.json scripts/automation/data/revenue-watch-seen.json scripts/automation/data/ux-watch-seen.json scripts/automation/data/deliverability-watch-seen.json scripts/automation/data/factory-heartbeat-watch-seen.json scripts/automation/data/widget-hosts-seen.json scripts/automation/data/widget-converted-sent.json scripts/automation/data/b2b-cold-sent.json scripts/automation/data/b2b-followup-sent.json scripts/automation/data/b2b-funnel.json scripts/automation/data/daily-brief-sent.json scripts/automation/data/ux-daily-sent.json scripts/automation/data/push-winback-sent.json scripts/automation/data/blast-mollie-offer-sent.json scripts/automation/data/mollie-mrr.json scripts/automation/data/funnel-snapshot.json scripts/automation/data/funnel-daily-report.json public/api/b2b-paylinks.json public/api/mollie-passlinks.json; do
            [ -f "$f" ] && git add "$f"
          done
          # NOTE : la publication du snapshot métrique quotidien est désormais une
          # responsabilité SÉPARÉE (step « Publish daily metrics snapshot` ci-dessous),
          # car un échec de publication doit faire ÉCHOUER le workflow — ce que
          # `continue-on-error` interdisait sur ce step anti-doublon des emails.
          # La garde d'exploitabilité et le test de cadence vivent dans ce step.
          if git diff --cached --quiet; then echo "Email state unchanged."; exit 0; fi
          git commit -m "chore: email state $(date -u +'%Y-%m-%d %H:%M UTC')"
          BRANCH="${GITHUB_REF_NAME:-main}"
          push_ok=0
          for i in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            if ! git rebase -X theirs "origin/$BRANCH"; then
              echo "::warning::git rebase -X theirs échoué (tentative $i/5)"
              git rebase --abort || true
              sleep 10
              continue
            fi
            # Idempotence (exécutions concurrentes) : mêmes marqueurs déjà sur
            # main => publication acquise, pas de doublon.
            if git diff --quiet "origin/$BRANCH"; then
              echo "État email déjà publié par une exécution concurrente — publication acquise."
              push_ok=1
              break
            fi
            if git push origin "HEAD:$BRANCH"; then
              push_ok=1
              echo "git push OK (tentative $i)"
              break
            fi
            echo "::warning::git push échoué (tentative $i/5), pause 20s"
            sleep 20
          done
          [ "$push_ok" = "1" ] || echo "::error title=Email state non persisté::markers anti-doublon non poussés après 5 tentatives"

  # ── 3. HEALTH CHECK (rapide, parallèle) ───────────────────────────────────
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - name: Health check (uptime + staleness)
        if: github.event_name != 'push'
        continue-on-error: true
        run: node scripts/automation/health-check.cjs

  # ── 4. BUILD (parallèle par région, si push) ──────────────────────────────
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - id: mq
          - id: gp
          - id: florida
          - id: puntacana
          - id: rivieramaya
          - id: tulum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: node -e "require('./regions/index.cjs').assertAllRegionsValid()"
      - name: Build region
        env:
          VITE_REGION: ${{ matrix.id }}
        run: npm run build

  # ── 5. NOTIFY ON FAILURE ──────────────────────────────────────────────────
  notify-failure:
    needs: [fetch-data, email-automation, health-check, build]
    if: failure() && (needs.fetch-data.result == 'skipped' || needs.fetch-data.outputs.publication_status == 'FRESH_AND_PUBLISHED' || needs.fetch-data.outputs.publication_status == 'NO_NEW_OBSERVATION')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - name: Send failure alert email
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          WORKFLOW_NAME: 'Daily Copernicus + Deploy'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/automation/notify-failure.cjs

  # ── 6. RETRY ON FAILURE (once, after 5 min, schedule only) ───────────────
  retry-on-failure:
    needs: [fetch-data, email-automation, health-check, build]
    if: failure() && (needs.fetch-data.outputs.publication_status == 'FRESH_AND_PUBLISHED' || needs.fetch-data.outputs.publication_status == 'NO_NEW_OBSERVATION') && github.run_attempt == '1' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Wait 5 minutes before retry
        run: sleep 300
      - name: Retry workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run daily-copernicus.yml --repo ${{ github.repository }} --ref ${{ github.ref }}