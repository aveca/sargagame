name: Cloudflare Production

# ARCHITECTURE DU DÉCLENCHEMENT (P0 — cf. run 39383768675 / SHA 4eea0367)
#
#   push sur `main`            -> parcours de PRODUCTION complet :
#                                  build -> certification-gate (fail-closed)
#                                  -> deploy + deploy-pages -> verify-fleet
#                                  -> post-deploy-verify
#   workflow_dispatch sur `main` -> idem (déploiement manuel encadré)
#   workflow_run (Copernicus sur `main`, réussi) -> idem (rafraîchissement
#                                  des données puis déploiement du contenu de main)
#   toute autre ref / tout autre événement -> run de VALIDATION :
#                                  le job `scope` marque le parcours de
#                                  production NON APPLICABLE ; les builds et les
#                                  contrôles sont exécutés, les jobs de
#                                  production sont écartés explicitement.
#
# Pourquoi : la porte de certification exige les checks CI `test-frontend` et
# `perf` SUR LE SHA EXACT. Ces checks ne sont produits que sur `main` (ou PR
# vers `main`). Déclencher la production sur une branche de développement rend
# donc la porte inexécutable — refus systématique, sans bug de code (10 runs
# rouges identiques sur `agent/coding/TASK-P1-002`).
#
# La porte reste fail-closed : sur un run de PRODUCTION, sans checks requis
# verts sur le SHA exact, le déploiement est refusé. Ni le garde-fou, ni la
# liste des checks requis, ni la vérification de déploiement ne sont modifiés.

on:
  workflow_dispatch:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Daily Copernicus + Deploy
    types:
      - completed
    # Filtre de branche : un déploiement ne peut être déclenché que par un
    # run de l'amorce effectué sur `main` (une publication sur une branche de
    # développement ne doit jamais déclencher un déploiement de production).
    branches:
      - main
    # NOTE (2026-10-20) : ce déclencheur reste INOPÉRANT dans ce dépôt —
    # 0 run `workflow_run` produit sur 162 exécutions, alors que l'amorce
    # « Daily Copernicus + Deploy » s'est terminée plus de 247 fois depuis le
    # 07/10 (y compris après le run 39406923824, terminé en `failure`).
    # Le seul déclencheur `workflow_run` qui fonctionne ici
    # (`user-journey-audit.yml` → « Cloudflare Production ») déclare le même
    # filtre de branche — sans que cela suffise à réveiller celui-ci.
    # Le chemin RÉEL de publication → déploiement est désormais EXPLICITE :
    # `data-refresh.yml` / `daily-copernicus.yml` dispatchent `ci-tests.yml`,
    # `perf-budget.yml` puis `cloudflare-production.yml` sur le SHA exact
    # (scripts/automation/trigger-production-deploy.cjs). Vérifié en
    # production : runs 39410485389 / 39410487343 / 39410489619, tous verts.
    # Ce déclencheur est conservé comme filet de sécurité (il ne peut pas
    # double-déployer : le groupe de concurrence sérialise les runs) — mais il
    # ne doit PAS être compté comme un chemin de livraison fiable.

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  # ── PÉRIMÈTRE D'APPLICATION (P0) ──────────────────────────────────────────
  # Détermine si ce run est un run de PRODUCTION (déploiement réel) ou un run
  # de VALIDATION (build + contrôles de développement, sans parcours de prod).
  #
  # POURQUOI CE JOB EXISTE — cause racine des 10 échecs de certification
  # observés (run 39383768675, SHA 4eea0367, branche agent/coding/TASK-P1-002) :
  # ce workflow se déclenchait en `push` sur une branche de développement, alors
  # que les checks CI exigés par la porte de certification (`test-frontend`,
  # `perf`) ne sont produits que sur `main` (ou PR vers `main`). Sur une autre
  # ref ils n'existent JAMAIS pour ce SHA : la porte, fail-closed par
  # conception, refusait systématiquement — 10 exécutions rouges identiques,
  # aucune ligne de code en cause.
  #
  # CE QUE CE JOB NE FAIT PAS — il ne contourne aucune preuve :
  #   - la porte de certification reste fail-closed et inchangée sur tout run
  #     de production (mêmes checks requis, même attente bornée anti-course) ;
  #   - un run non applicable n'est jamais « vert » par fraude : les jobs de
  #     production sont ÉCARTÉS (skipped) et le motif est écrit explicitement
  #     dans le résumé du run (GitHub annotation ::warning::) ;
  #   - une absence de preuve n'est jamais convertie en succès : un run de
  #     production sans `test-frontend`/`perf` verts reste rouge.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      production: ${{ steps.decide.outputs.production }}
      ref: ${{ steps.decide.outputs.ref }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          TRIGGER_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          production=false
          reason=""
          case "$EVENT_NAME" in
            push)
              if [ "$REF_NAME" = "main" ]; then
                production=true
                reason="push sur 'main' : parcours de production applicable"
              fi
              ;;
            workflow_dispatch)
              if [ "$REF_NAME" = "main" ]; then
                production=true
                reason="declenchement manuel sur 'main' : parcours de production applicable"
              fi
              ;;
            workflow_run)
              if [ "$TRIGGER_BRANCH" = "main" ] && [ "$TRIGGER_CONCLUSION" = "success" ]; then
                production=true
                reason="workflow_run 'Daily Copernicus + Deploy' reussi sur 'main' : parcours de production applicable"
              fi
              ;;
            *)
              reason="evenement '$EVENT_NAME' non couvert par un deploiement"
              ;;
          esac
          if [ "$production" != "true" ]; then
            reason="ref '$REF_NAME' (evenement '$EVENT_NAME') non deployable : parcours de production NON APPLICABLE - build et controles executes, aucun deploiement, aucune certification exigee"
            echo "::warning title=Cloudflare Production - parcours non applicable::${reason}"
          fi
          echo "production=$production" >> "$GITHUB_OUTPUT"
          echo "ref=$REF_NAME" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          {
            echo "## Cloudflare Production - perimetre du run"
            echo ""
            echo "- Evenement : \`$EVENT_NAME\`"
            echo "- Ref : \`$REF_NAME\`"
            echo "- Parcours de production : \`$production\`"
            echo "- Motif : $reason"
            if [ "$production" != "true" ]; then
              echo ""
              echo "> **NON APPLICABLE** - ce run ne deploie rien."
              echo "> Les jobs de production (certification-gate, deploy, deploy-pages,"
              echo "> verify-fleet, post-deploy-verify) sont ecartes explicitement."
              echo "> Les builds et controles de ce run restent valables comme"
              echo "> validation de developpement."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - id: mq
          - id: gp
          - id: florida
          - id: puntacana
          - id: rivieramaya
          - id: tulum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node -e "require('./regions/index.cjs').assertAllRegionsValid()"
      - name: Build region
        env:
          VITE_REGION: ${{ matrix.id }}
        run: npm run build
      # Garde-fou : prepare-ftp doit réussir AVANT tout deploy. C'est lui qui
      # crée sitemap.xml, le robots.txt par domaine, l'overlay _gp/, réécrit les
      # canonicals et swap les données Copernicus par région.
      - name: Verify prepare-ftp produces a deployable site
        env:
          VITE_REGION: ${{ matrix.id }}
        run: |
          set -euo pipefail
          node scripts/prepare-ftp.cjs
          node -e "const fs=require('fs');const d=require('./regions/index.cjs').getRegion(process.env.VITE_REGION).ftpDir;for(const f of ['index.html','sitemap.xml','robots.txt','version.json','api/copernicus/sargassum.json']){if(!fs.existsSync(d+'/'+f)){console.error('missing: '+d+'/'+f);process.exit(1)}}console.log('prepare-ftp OK -> '+d)"
      - name: Pre-deploy satellite freshness gate (all six regions)
        env:
          VITE_REGION: ${{ matrix.id }}
        run: node scripts/autopilot/check-predeploy-satellite-freshness.cjs
      - name: Validate prepared HTML CSP and bundle references
        env:
          VITE_REGION: ${{ matrix.id }}
        run: node scripts/autopilot/check-prepared-html.cjs
      # Garde P0 MQ/GP : l'artefact préparé ne doit contenir aucune plage
      # d'une autre île (bloque le déploiement via `needs: [build, ...]`).
      - name: Guard regional data separation (no foreign beaches)
        env:
          VITE_REGION: ${{ matrix.id }}
        run: node scripts/check-regional-artifact.cjs --region "$VITE_REGION"

  # VERROU GOUVERNANCE — certification stricte AVANT toute mise en production.
  # Contrat v3 (états séparés) :
  #   PRODUCTION_VERIFIED  = attestation complète committée, valide pour le SHA produit
  #   PREDEPLOY_ELIGIBLE   = checks CI requis (test-frontend, perf) VERTS sur le SHA
  #                          exact → autorise le déploiement, qui restera
  #                          DEPLOYED_PENDING_VERIFICATION jusqu'au contrôle post-deploy
  #   NOT_PROVEN           = checks absents/rouges/en-cours, API indisponible,
  #                          attestation corrompue ⇒ REFUS (deploy/deploy-pages skipped)
  certification-gate:
    needs: [scope]
    if: needs.scope.outputs.production == 'true'
    permissions:
      contents: read
      checks: read        # lecture des check-runs du SHA (preuve CI authentique)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      JOB_TRACE_ID: job-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # requis : résolution du commit produit effectif
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Attente bornée anti-course gate-vs-CI (P0) : la gate tourne dans la
      # même vague que test-frontend/perf. Sans --wait-ms elle les voit
      # `in_progress` et refuse à jamais (aucun retry) — livraison bloquée
      # alors que tout finit vert. Échec => refus immédiat, timeout => refus.
      - name: Certification gate (deploy)
        id: gate
        run: node scripts/CHECK_certification_status.cjs --mode deploy --wait-ms 1200000
      - name: Trace gate decision (job_id)
        if: always()
        run: |
          mkdir -p scripts/traces
          node -e "const fs=require('fs');const f='scripts/traces/'+process.env.JOB_TRACE_ID+'.json';const t=fs.existsSync(f)?JSON.parse(fs.readFileSync(f,'utf8')):{jobId:process.env.JOB_TRACE_ID,taskId:'CF-PROD-PIPELINE',createdAt:new Date().toISOString(),gitSha:process.env.GITHUB_SHA,steps:[]};t.steps.push({step:'certification-gate',status:process.env.GATE_OUTCOME==='success'?'completed':'failed',timestamp:new Date().toISOString(),details:{sha:process.env.GITHUB_SHA}});fs.writeFileSync(f,JSON.stringify(t,null,2))"
        env:
          GATE_OUTCOME: ${{ steps.gate.outcome }}
      - name: Upload job trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: scripts/traces/
          if-no-files-found: ignore
          retention-days: 90

  mollie-live-gate:
    needs: [scope]
    if: needs.scope.outputs.production == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MOLLIE_API_KEY: ${{ secrets.MOLLIE_API_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      MOLLIE_WEBHOOK_SECRET: ${{ secrets.MOLLIE_WEBHOOK_SECRET }}
    steps:
      - name: Require LIVE Mollie key and payment backend secrets
        shell: bash
        run: |
          set -euo pipefail
          case "${MOLLIE_API_KEY:-}" in
            live_*) echo "Mollie key mode: LIVE" ;;
            *) echo "::error::MOLLIE_API_KEY must be configured with a live_ key before production deployment"; exit 1 ;;
          esac
          test -n "${SUPABASE_SERVICE_KEY:-}" || { echo "::error::SUPABASE_SERVICE_KEY is missing"; exit 1; }
          test -n "${MOLLIE_WEBHOOK_SECRET:-}" || { echo "::error::MOLLIE_WEBHOOK_SECRET is missing"; exit 1; }
          echo "Required payment backend secrets are present; values were not printed."

  deploy:
    needs: [build, certification-gate, scope, mollie-live-gate]
    if: (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' && needs.scope.outputs.production == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: mq
            domain: sargasses-martinique.com
          - id: gp
            domain: sargasses-guadeloupe.com
          - id: florida
            domain: sargassummiami.com
          - id: puntacana
            domain: sargassumpuntacana.com
          - id: rivieramaya
            domain: sargassumcancun.com
          - id: tulum
            domain: sargazotulum.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MOLLIE_API_KEY: ${{ secrets.MOLLIE_API_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      MOLLIE_WEBHOOK_SECRET: ${{ secrets.MOLLIE_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node -e "require('./regions/index.cjs').assertAllRegionsValid()"
      - name: Build region
        env:
          VITE_REGION: ${{ matrix.id }}
        run: npm run build
      # Le Worker sert ce dossier, pas dist/. prepare-ftp = transformation
      # domaine (canonicals, robots, sitemap.xml, overlay _gp/, données
      # Copernicus de la région). Sans elle chaque domaine reçoit le build brut.
      - name: Prepare domain site (prepare-ftp)
        env:
          VITE_REGION: ${{ matrix.id }}
        run: |
          set -euo pipefail
          node scripts/prepare-ftp.cjs
          node -e "const fs=require('fs');const d=require('./regions/index.cjs').getRegion(process.env.VITE_REGION).ftpDir;for(const f of ['index.html','sitemap.xml','robots.txt','version.json','api/copernicus/sargassum.json']){if(!fs.existsSync(d+'/'+f)){console.error('missing: '+d+'/'+f);process.exit(1)}}console.log('assets dir OK -> '+d)"
      - name: Validate deploy HTML CSP and bundle references
        env:
          VITE_REGION: ${{ matrix.id }}
        run: node scripts/autopilot/check-prepared-html.cjs
      # Garde P0 MQ/GP (2e rideau) : revérifie l'artefact du job deploy lui-même
      # avant génération wrangler/envoi Cloudflare.
      - name: Guard regional data separation (no foreign beaches)
        env:
          VITE_REGION: ${{ matrix.id }}
        run: node scripts/check-regional-artifact.cjs --region "$VITE_REGION"
      - name: Generate Wrangler config
        env:
          REGION: ${{ matrix.id }}
          DOMAIN: ${{ matrix.domain }}
        run: |
          node -e "const fs=require('fs');const ftp=String(require('./regions/index.cjs').getRegion(process.env.REGION).ftpDir).replace(/^.\//,'');if(!fs.existsSync(ftp+'/index.html')){console.error('assets dir missing '+ftp);process.exit(1)};let s=fs.readFileSync('wrangler.template.jsonc','utf8').replaceAll('__REGION__',process.env.REGION).replaceAll('__DOMAIN__',process.env.DOMAIN).replaceAll('__ASSETS_DIR__','./'+ftp);fs.writeFileSync('wrangler.jsonc',s)"
      - name: Recheck satellite freshness immediately before Worker deploy
        env:
          VITE_REGION: ${{ matrix.id }}
        run: node scripts/autopilot/check-predeploy-satellite-freshness.cjs
      - name: Deploy Worker
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc --strict
      - name: Configure Worker secrets
        run: |
          printf '%s' "$MOLLIE_API_KEY" | npx --yes wrangler@latest secret put MOLLIE_API_KEY --config wrangler.jsonc
          printf '%s' "$SUPABASE_SERVICE_KEY" | npx --yes wrangler@latest secret put SUPABASE_SERVICE_KEY --config wrangler.jsonc
          printf '%s' "$MOLLIE_WEBHOOK_SECRET" | npx --yes wrangler@latest secret put MOLLIE_WEBHOOK_SECRET --config wrangler.jsonc
      - name: Smoke test
        env:
          DOMAIN: ${{ matrix.domain }}
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 20 -A "Mozilla/5.0" "https://$DOMAIN/?cfdeploy=$GITHUB_SHA" || true)
            [ "$code" = "200" ] && exit 0
            sleep $((i*5))
          done
          exit 1
      # Garde-fou de déploiement (restauré) : compare le (v, b) du dossier qui
      # a RÉELLEMENT été servi au (v, b) servi en ligne. Un "curl / → 200" ne
      # détecte ni un dossier obsolète ni un Worker pas encore mis à jour.
      - name: Verify deploy fingerprint
        env:
          REGION: ${{ matrix.id }}
          DOMAIN: ${{ matrix.domain }}
        run: |
          set -euo pipefail
          FTP_DIR=$(node -e "console.log(require('./regions/index.cjs').getRegion(process.env.REGION).ftpDir)")
          built_v=$(node -p "require('./${FTP_DIR}/version.json').v")
          built_b=$(node -p "require('./${FTP_DIR}/version.json').b")
          echo "built: region=$REGION dir=$FTP_DIR v=$built_v b=$built_b"
          ok=0
          for i in 1 2 3 4 5 6 7 8; do
            body=$(curl -sS --max-time 20 -A "Mozilla/5.0" "https://$DOMAIN/version.json?cfdeploy=$GITHUB_SHA" || true)
            live_v=$(printf '%s' "$body" | node -p "try{JSON.parse(require('fs').readFileSync(0,'utf8')).v}catch(e){'parse-error'}" || echo error)
            live_b=$(printf '%s' "$body" | node -p "try{JSON.parse(require('fs').readFileSync(0,'utf8')).b}catch(e){'parse-error'}" || echo error)
            if [ "$live_v" = "$built_v" ] && [ "$live_b" = "$built_b" ]; then
              ok=1; echo "fingerprint OK: v=$live_v b=$live_b"; break
            fi
            echo "attempt $i: live v=$live_v b=$live_b != built v=$built_v b=$built_b"
            sleep $((i*5))
          done
          if [ "$ok" != "1" ]; then
            echo "FINGERPRINT MISMATCH on $DOMAIN — le domaine ne sert pas ce qui vient d'être déployé"
            exit 1
          fi
          FTP_DIR="$FTP_DIR" REGION="$REGION" DOMAIN="$DOMAIN" node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { extractHtmlFingerprint } = require('./scripts/autopilot/html-integrity.cjs');
          const dir = process.env.FTP_DIR;
          const region = process.env.REGION;
          const domain = process.env.DOMAIN;
          const indexPath = path.join(dir, 'index.html');
          const html = fs.readFileSync(indexPath, 'utf8');
          const fp = extractHtmlFingerprint(html, domain);
          if (!fp.ok) {
            console.error('PREPARED HTML INTEGRITY FAILED: ' + fp.reason);
            process.exit(1);
          }
          const version = JSON.parse(fs.readFileSync(path.join(dir, 'version.json'), 'utf8'));
          if (!version.v || !version.b) {
            console.error('prepared version.json has no v/b fingerprint');
            process.exit(1);
          }
          const record = { id: region, domain, v: String(version.v), b: String(version.b),
            cspSha256: fp.cspSha256, moduleSrc: fp.moduleSrc, cssSrcs: fp.cssSrcs };
          fs.writeFileSync('fingerprint-' + region + '.json', JSON.stringify(record, null, 2));
          console.log('prepared HTML fingerprint OK: region=' + region + ' cspSha256=' + fp.cspSha256 +
            ' module=' + fp.moduleSrc + ' css=' + fp.cssSrcs.length);
          NODE
          # Sitemap : doit être 200 APRÈS prepare-ftp (régression du 07/10).
          for i in 1 2 3 4 5; do
            sm=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 -A "Mozilla/5.0" "https://$DOMAIN/sitemap.xml" || true)
            if [ "$sm" = "200" ]; then echo "sitemap.xml 200 OK"; break; fi
            if [ "$i" = "5" ]; then echo "sitemap.xml = $sm on $DOMAIN"; exit 1; fi
            sleep $((i*5))
          done
      - name: Upload fingerprint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-${{ matrix.id }}
          path: fingerprint-${{ matrix.id }}.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Payment API smoke
        env:
          DOMAIN: ${{ matrix.domain }}
        run: |
          code=$(curl -sS -o /tmp/mollie-smoke.json -w "%{http_code}" --max-time 20 \
            -X POST -H "Content-Type: application/json" \
            --data '{"action":"__payment_smoke__"}' \
            "https://$DOMAIN/api/mollie.php" || true)
          cat /tmp/mollie-smoke.json || true
          if [ "$code" != "400" ]; then
            echo "Payment API smoke failed: expected HTTP 400 from a configured Worker, got $code"
            exit 1
          fi
          if grep -Eq '"error":"(payment_backend_not_configured|api_route_not_migrated)' /tmp/mollie-smoke.json; then
            echo "Payment backend is not configured or route is not migrated"
            exit 1
          fi

  # CONTRÔLE POST-DÉPLOIEMENT RÉEL — s'exécute UNIQUEMENT après un déploiement
  # autorisé et réussi. Vérifications HTTP réelles sur chaque domaine live :
  # accessibilité, identité artefact (version.json), fraîcheur données,
  # cohérence région↔plages, params régionaux (canonical, GA4), ?sos=1,
  # contrat API paiement (POST __payment_smoke__ => 400, backend configuré).
  # Tout contrôle non réalisable reste NOT_VERIFIED ; tout échec => job rouge.
  post-deploy-verify:
    needs: [deploy, scope]
    if: always() && needs.deploy.result == 'success' && needs.scope.outputs.production == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JOB_TRACE_ID: job-${{ github.run_id }}-${{ github.run_attempt }}
      # Utilisé uniquement si l’intégrité HTML live échoue : purge des 2 URL exactes.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # P0 §4 : l'identité d'artefact post-déploiement doit COMPARER le servi
      # au construit (v/b des 6 fingerprints uploadés par le job deploy).
      # Sans attente, artifact_identity reste NOT_VERIFIED (jamais VERIFIED).
      - name: Download built fingerprints
        uses: actions/download-artifact@v4
        with:
          pattern: fingerprint-*
          path: fingerprints/
          merge-multiple: true
      - name: Resolve expected fingerprint (built v/b, all regions agree)
        id: fp
        run: |
          node -e "const fs=require('fs');const files=fs.readdirSync('fingerprints').filter(f=>f.endsWith('.json'));if(!files.length){console.error('no fingerprint artifacts');process.exit(1)}const vs=new Set(),bs=new Set();for(const f of files){const j=JSON.parse(fs.readFileSync('fingerprints/'+f,'utf8'));vs.add(j.v);bs.add(j.b)}if(vs.size!==1||bs.size!==1){console.error('fingerprints disagree: v='+[...vs]+' b='+[...bs]);process.exit(1)}fs.appendFileSync(process.env.GITHUB_OUTPUT,'v='+[...vs][0]+'\n');fs.appendFileSync(process.env.GITHUB_OUTPUT,'b='+[...bs][0]+'\n');console.log('expect v='+[...vs][0]+' b='+[...bs][0])"
      - name: Post-deploy verification (all live domains)
        id: pdv
        run: node scripts/autopilot/post-deploy-verify.cjs --all --sos-test --job "$JOB_TRACE_ID" --report post-deploy-report.json --expect-v "${{ steps.fp.outputs.v }}" --expect-b "${{ steps.fp.outputs.b }}" --fingerprint-dir fingerprints/
      - name: Upload post-deploy report + job trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            post-deploy-report.json
            scripts/traces/
          if-no-files-found: ignore
          retention-days: 90
      - name: Summary
        if: always()
        run: |
          node -e "const fs=require('fs');if(fs.existsSync('post-deploy-report.json')){const r=JSON.parse(fs.readFileSync('post-deploy-report.json','utf8'));let s='## Post-deploy verification\n\nJob trace: '+r.jobId+'\n\nSTAGE: **'+r.stage+'**\n\n| Région | Domaine | Stade |\n|---|---|---|\n';for(const d of r.domains)s+='| '+d.region+' | '+d.domain+' | '+d.stage+' |\n';fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,s)}"

  deploy-pages:
    needs: [build, certification-gate, scope, mollie-live-gate]
    if: (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' && needs.scope.outputs.production == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      deployments: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - region: mq
            project: sargagame
          - region: gp
            project: sargagame-gp
          - region: florida
            project: sargagame-florida
          - region: puntacana
            project: sargagame-puntacana
          - region: rivieramaya
            project: sargagame-rivieramaya
          - region: tulum
            project: sargagame-tulum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node -e "require('./regions/index.cjs').assertAllRegionsValid()"
      - name: Build region
        env:
          VITE_REGION: ${{ matrix.region }}
        run: npm run build
      # Pages doit recevoir le même artefact que le Worker, sinon *.pages.dev
      # et le domaine divergent (source de faux diagnostics en audit).
      - name: Prepare domain site (prepare-ftp)
        id: prep
        env:
          VITE_REGION: ${{ matrix.region }}
        run: |
          set -euo pipefail
          node scripts/prepare-ftp.cjs
          node -e "const fs=require('fs');const d=require('./regions/index.cjs').getRegion(process.env.VITE_REGION).ftpDir;if(!fs.existsSync(d+'/index.html')){console.error('missing '+d+'/index.html');process.exit(1)};require('fs').appendFileSync(process.env.GITHUB_OUTPUT,'dir='+d+'\n')"
      - name: Validate Pages HTML CSP and bundle references
        env:
          VITE_REGION: ${{ matrix.region }}
        run: node scripts/autopilot/check-prepared-html.cjs
      # Garde P0 MQ/GP : idem deploy-pages (avant envoi Cloudflare).
      - name: Guard regional data separation (no foreign beaches)
        env:
          VITE_REGION: ${{ matrix.region }}
        run: node scripts/check-regional-artifact.cjs --region "$VITE_REGION"
      - name: Recheck satellite freshness immediately before Pages deploy
        env:
          VITE_REGION: ${{ matrix.region }}
        run: node scripts/autopilot/check-predeploy-satellite-freshness.cjs
      - name: Deploy Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ steps.prep.outputs.dir }} --project-name=${{ matrix.project }} --branch=main

  # Contrôle de flotte : les 6 domaines doivent rester cohérents entre eux.
  # C'est le garde-fou qui aurait bloqué le cutover du 07/10 (tulum figé,
  # sitemap 404 sur 3 domaines, canonicals GP → Martinique).
  verify-fleet:
    needs: [deploy, scope]
    if: always() && needs.deploy.result == 'success' && needs.scope.outputs.production == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fleet coherence + SEO guards (live)
        run: node scripts/verify-live-fleet.cjs --regions mq,gp,florida,puntacana,rivieramaya,tulum
