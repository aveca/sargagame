name: Cloudflare Production

on:
  workflow_dispatch:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Daily Copernicus + Deploy
      - Data Freshness (ERDDAP → repo)
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  # A workflow_run completion alone is insufficient: Data Freshness can finish
  # successfully without committing data when the integrity gate blocks or
  # there are no changes. Deploy only when main advanced past the upstream SHA.
  publication-gate:
    name: Confirm upstream workflow published a main commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      eligible: ${{ steps.publication.outputs.eligible }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Check publication eligibility
        id: publication
        env:
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT_NAME" != "workflow_run" ]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$UPSTREAM_HEAD_SHA" ]; then
            echo "::error::Missing upstream workflow head SHA; fail closed."
            exit 1
          fi
          git fetch origin main
          MAIN_SHA=$(git rev-parse origin/main)
          if [ "$MAIN_SHA" = "$UPSTREAM_HEAD_SHA" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No new main commit from upstream; production deployment skipped."
          else
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            echo "main advanced from $UPSTREAM_HEAD_SHA to $MAIN_SHA."
          fi

  build:
    needs: [publication-gate]
    if: needs.publication-gate.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - id: mq
          - id: gp
          - id: florida
          - id: puntacana
          - id: rivieramaya
          - id: tulum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node -e "require('./regions/index.cjs').assertAllRegionsValid()"
      - name: Build region
        env:
          VITE_REGION: ${{ matrix.id }}
        run: npm run build
      # Garde-fou : prepare-ftp doit réussir AVANT tout deploy. C'est lui qui
      # crée sitemap.xml, le robots.txt par domaine, l'overlay _gp/, réécrit les
      # canonicals et swap les données Copernicus par région.
      - name: Verify prepare-ftp produces a deployable site
        env:
          VITE_REGION: ${{ matrix.id }}
        run: |
          set -euo pipefail
          node scripts/prepare-ftp.cjs
          node -e "const fs=require('fs');const d=require('./regions/index.cjs').getRegion(process.env.VITE_REGION).ftpDir;for(const f of ['index.html','sitemap.xml','robots.txt','version.json','api/copernicus/sargassum.json']){if(!fs.existsSync(d+'/'+f)){console.error('missing: '+d+'/'+f);process.exit(1)}}console.log('prepare-ftp OK -> '+d)"

  # VERROU GOUVERNANCE — certification stricte AVANT toute mise en production.
  # Contrat v3 (états séparés) :
  #   PRODUCTION_VERIFIED  = attestation complète committée, valide pour le SHA produit
  #   PREDEPLOY_ELIGIBLE   = checks CI requis (test-frontend, perf) VERTS sur le SHA
  #                          exact → autorise le déploiement, qui restera
  #                          DEPLOYED_PENDING_VERIFICATION jusqu'au contrôle post-deploy
  #   NOT_PROVEN           = checks absents/rouges/en-cours, API indisponible,
  #                          attestation corrompue ⇒ REFUS (deploy/deploy-pages skipped)
  certification-gate:
    needs: [publication-gate]
    if: needs.publication-gate.outputs.eligible == 'true'
    permissions:
      contents: read
      checks: read        # lecture des check-runs du SHA (preuve CI authentique)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      JOB_TRACE_ID: job-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # requis : résolution du commit produit effectif
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Certification gate (deploy)
        id: gate
        run: node scripts/CHECK_certification_status.cjs --mode deploy
      - name: Trace gate decision (job_id)
        if: always()
        run: |
          mkdir -p scripts/traces
          node -e "const fs=require('fs');const f='scripts/traces/'+process.env.JOB_TRACE_ID+'.json';const t=fs.existsSync(f)?JSON.parse(fs.readFileSync(f,'utf8')):{jobId:process.env.JOB_TRACE_ID,taskId:'CF-PROD-PIPELINE',createdAt:new Date().toISOString(),gitSha:process.env.GITHUB_SHA,steps:[]};t.steps.push({step:'certification-gate',status:process.env.GATE_OUTCOME==='success'?'completed':'failed',timestamp:new Date().toISOString(),details:{sha:process.env.GITHUB_SHA}});fs.writeFileSync(f,JSON.stringify(t,null,2))"
        env:
          GATE_OUTCOME: ${{ steps.gate.outcome }}
      - name: Upload job trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: scripts/traces/
          if-no-files-found: ignore
          retention-days: 90

  deploy:
    needs: [build, certification-gate, publication-gate]
    if: needs.publication-gate.outputs.eligible == 'true' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')) && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: mq
            domain: sargasses-martinique.com
          - id: gp
            domain: sargasses-guadeloupe.com
          - id: florida
            domain: sargassummiami.com
          - id: puntacana
            domain: sargassumpuntacana.com
          - id: rivieramaya
            domain: sargassumcancun.com
          - id: tulum
            domain: sargazotulum.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MOLLIE_API_KEY: ${{ secrets.MOLLIE_API_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      MOLLIE_WEBHOOK_SECRET: ${{ secrets.MOLLIE_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node -e "require('./regions/index.cjs').assertAllRegionsValid()"
      - name: Build region
        env:
          VITE_REGION: ${{ matrix.id }}
        run: npm run build
      # Le Worker sert ce dossier, pas dist/. prepare-ftp = transformation
      # domaine (canonicals, robots, sitemap.xml, overlay _gp/, données
      # Copernicus de la région). Sans elle chaque domaine reçoit le build brut.
      - name: Prepare domain site (prepare-ftp)
        env:
          VITE_REGION: ${{ matrix.id }}
        run: |
          set -euo pipefail
          node scripts/prepare-ftp.cjs
          node -e "const fs=require('fs');const d=require('./regions/index.cjs').getRegion(process.env.VITE_REGION).ftpDir;for(const f of ['index.html','sitemap.xml','robots.txt','version.json','api/copernicus/sargassum.json']){if(!fs.existsSync(d+'/'+f)){console.error('missing: '+d+'/'+f);process.exit(1)}}console.log('assets dir OK -> '+d)"
      - name: Generate Wrangler config
        env:
          REGION: ${{ matrix.id }}
          DOMAIN: ${{ matrix.domain }}
        run: |
          node -e "const fs=require('fs');const ftp=String(require('./regions/index.cjs').getRegion(process.env.REGION).ftpDir).replace(/^.\//,'');if(!fs.existsSync(ftp+'/index.html')){console.error('assets dir missing '+ftp);process.exit(1)};let s=fs.readFileSync('wrangler.template.jsonc','utf8').replaceAll('__REGION__',process.env.REGION).replaceAll('__DOMAIN__',process.env.DOMAIN).replaceAll('__ASSETS_DIR__','./'+ftp);fs.writeFileSync('wrangler.jsonc',s)"
      - name: Deploy Worker
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc --strict
      - name: Configure Worker secrets
        run: |
          printf '%s' "$MOLLIE_API_KEY" | npx --yes wrangler@latest secret put MOLLIE_API_KEY --config wrangler.jsonc
          printf '%s' "$SUPABASE_SERVICE_KEY" | npx --yes wrangler@latest secret put SUPABASE_SERVICE_KEY --config wrangler.jsonc
          printf '%s' "$MOLLIE_WEBHOOK_SECRET" | npx --yes wrangler@latest secret put MOLLIE_WEBHOOK_SECRET --config wrangler.jsonc
      - name: Smoke test
        env:
          DOMAIN: ${{ matrix.domain }}
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 20 -A "Mozilla/5.0" "https://$DOMAIN/?cfdeploy=$GITHUB_SHA" || true)
            [ "$code" = "200" ] && exit 0
            sleep $((i*5))
          done
          exit 1
      # Garde-fou de déploiement (restauré) : compare le (v, b) du dossier qui
      # a RÉELLEMENT été servi au (v, b) servi en ligne. Un "curl / → 200" ne
      # détecte ni un dossier obsolète ni un Worker pas encore mis à jour.
      - name: Verify deploy fingerprint
        env:
          REGION: ${{ matrix.id }}
          DOMAIN: ${{ matrix.domain }}
        run: |
          set -euo pipefail
          FTP_DIR=$(node -e "console.log(require('./regions/index.cjs').getRegion(process.env.REGION).ftpDir)")
          built_v=$(node -p "require('./${FTP_DIR}/version.json').v")
          built_b=$(node -p "require('./${FTP_DIR}/version.json').b")
          echo "built: region=$REGION dir=$FTP_DIR v=$built_v b=$built_b"
          ok=0
          for i in 1 2 3 4 5 6 7 8; do
            body=$(curl -sS --max-time 20 -A "Mozilla/5.0" "https://$DOMAIN/version.json?cfdeploy=$GITHUB_SHA" || true)
            live_v=$(printf '%s' "$body" | node -p "try{JSON.parse(require('fs').readFileSync(0,'utf8')).v}catch(e){'parse-error'}" || echo error)
            live_b=$(printf '%s' "$body" | node -p "try{JSON.parse(require('fs').readFileSync(0,'utf8')).b}catch(e){'parse-error'}" || echo error)
            if [ "$live_v" = "$built_v" ] && [ "$live_b" = "$built_b" ]; then
              ok=1; echo "fingerprint OK: v=$live_v b=$live_b"; break
            fi
            echo "attempt $i: live v=$live_v b=$live_b != built v=$built_v b=$built_b"
            sleep $((i*5))
          done
          if [ "$ok" != "1" ]; then
            echo "FINGERPRINT MISMATCH on $DOMAIN — le domaine ne sert pas ce qui vient d'être déployé"
            exit 1
          fi
          echo "{\"id\":\"$REGION\",\"domain\":\"$DOMAIN\",\"v\":\"$built_v\",\"b\":\"$built_b\"}" > fingerprint-$REGION.json
          # Sitemap : doit être 200 APRÈS prepare-ftp (régression du 07/10).
          for i in 1 2 3 4 5; do
            sm=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 -A "Mozilla/5.0" "https://$DOMAIN/sitemap.xml" || true)
            if [ "$sm" = "200" ]; then echo "sitemap.xml 200 OK"; break; fi
            if [ "$i" = "5" ]; then echo "sitemap.xml = $sm on $DOMAIN"; exit 1; fi
            sleep $((i*5))
          done
      - name: Upload fingerprint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-${{ matrix.id }}
          path: fingerprint-${{ matrix.id }}.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Payment API smoke
        env:
          DOMAIN: ${{ matrix.domain }}
        run: |
          code=$(curl -sS -o /tmp/mollie-smoke.json -w "%{http_code}" --max-time 20 \
            -X POST -H "Content-Type: application/json" \
            --data '{"action":"__payment_smoke__"}' \
            "https://$DOMAIN/api/mollie.php" || true)
          cat /tmp/mollie-smoke.json || true
          if [ "$code" != "400" ]; then
            echo "Payment API smoke failed: expected HTTP 400 from a configured Worker, got $code"
            exit 1
          fi
          if grep -Eq '"error":"(payment_backend_not_configured|api_route_not_migrated)' /tmp/mollie-smoke.json; then
            echo "Payment backend is not configured or route is not migrated"
            exit 1
          fi

  # CONTRÔLE POST-DÉPLOIEMENT RÉEL — s'exécute UNIQUEMENT après un déploiement
  # autorisé et réussi. Vérifications HTTP réelles sur chaque domaine live :
  # accessibilité, identité artefact (version.json), fraîcheur données,
  # cohérence région↔plages, params régionaux (canonical, GA4), ?sos=1,
  # contrat API paiement (POST __payment_smoke__ => 400, backend configuré).
  # Tout contrôle non réalisable reste NOT_VERIFIED ; tout échec => job rouge.
  post-deploy-verify:
    needs: [deploy]
    if: always() && needs.deploy.result == 'success'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JOB_TRACE_ID: job-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Post-deploy verification (all live domains)
        id: pdv
        run: node scripts/autopilot/post-deploy-verify.cjs --all --sos-test --job "$JOB_TRACE_ID" --report post-deploy-report.json
      - name: Upload post-deploy report + job trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            post-deploy-report.json
            scripts/traces/
          if-no-files-found: ignore
          retention-days: 90
      - name: Summary
        if: always()
        run: |
          node -e "const fs=require('fs');if(fs.existsSync('post-deploy-report.json')){const r=JSON.parse(fs.readFileSync('post-deploy-report.json','utf8'));let s='## Post-deploy verification\n\nJob trace: '+r.jobId+'\n\nSTAGE: **'+r.stage+'**\n\n| Région | Domaine | Stade |\n|---|---|---|\n';for(const d of r.domains)s+='| '+d.region+' | '+d.domain+' | '+d.stage+' |\n';fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,s)}"

  deploy-pages:
    needs: [build, certification-gate]
    if: (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      deployments: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - region: mq
            project: sargagame
          - region: gp
            project: sargagame-gp
          - region: florida
            project: sargagame-florida
          - region: puntacana
            project: sargagame-puntacana
          - region: rivieramaya
            project: sargagame-rivieramaya
          - region: tulum
            project: sargagame-tulum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node -e "require('./regions/index.cjs').assertAllRegionsValid()"
      - name: Build region
        env:
          VITE_REGION: ${{ matrix.region }}
        run: npm run build
      # Pages doit recevoir le même artefact que le Worker, sinon *.pages.dev
      # et le domaine divergent (source de faux diagnostics en audit).
      - name: Prepare domain site (prepare-ftp)
        id: prep
        env:
          VITE_REGION: ${{ matrix.region }}
        run: |
          set -euo pipefail
          node scripts/prepare-ftp.cjs
          node -e "const fs=require('fs');const d=require('./regions/index.cjs').getRegion(process.env.VITE_REGION).ftpDir;if(!fs.existsSync(d+'/index.html')){console.error('missing '+d+'/index.html');process.exit(1)};require('fs').appendFileSync(process.env.GITHUB_OUTPUT,'dir='+d+'\n')"
      - name: Deploy Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ steps.prep.outputs.dir }} --project-name=${{ matrix.project }} --branch=main

  # Contrôle de flotte : les 6 domaines doivent rester cohérents entre eux.
  # C'est le garde-fou qui aurait bloqué le cutover du 07/10 (tulum figé,
  # sitemap 404 sur 3 domaines, canonicals GP → Martinique).
  verify-fleet:
    needs: [deploy]
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fleet coherence + SEO guards (live)
        run: node scripts/verify-live-fleet.cjs --regions mq,gp,florida,puntacana,rivieramaya,tulum
