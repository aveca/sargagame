name: Cloudflare Production

on:
  workflow_dispatch:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Daily Copernicus + Deploy
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - id: mq
          - id: gp
          - id: florida
          - id: puntacana
          - id: rivieramaya
          - id: tulum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node -e "require('./regions/index.cjs').assertAllRegionsValid()"
      - name: Build region
        env:
          VITE_REGION: ${{ matrix.id }}
        run: npm run build

  deploy:
    needs: build
    if: (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: mq
            domain: sargasses-martinique.com
          - id: gp
            domain: sargasses-guadeloupe.com
          - id: florida
            domain: sargassummiami.com
          - id: puntacana
            domain: sargassumpuntacana.com
          - id: rivieramaya
            domain: sargassumcancun.com
          - id: tulum
            domain: sargazotulum.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MOLLIE_API_KEY: ${{ secrets.MOLLIE_API_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      MOLLIE_WEBHOOK_SECRET: ${{ secrets.MOLLIE_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node -e "require('./regions/index.cjs').assertAllRegionsValid()"
      - name: Build region
        env:
          VITE_REGION: ${{ matrix.id }}
        run: npm run build
      - name: Generate Wrangler config
        env:
          REGION: ${{ matrix.id }}
          DOMAIN: ${{ matrix.domain }}
        run: node -e "const fs=require('fs');let s=fs.readFileSync('wrangler.template.jsonc','utf8').replaceAll('__REGION__',process.env.REGION).replaceAll('__DOMAIN__',process.env.DOMAIN);fs.writeFileSync('wrangler.jsonc',s)"
      - name: Deploy Worker
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc --strict
      - name: Configure Worker secrets
        run: |
          printf '%s' "$MOLLIE_API_KEY" | npx --yes wrangler@latest secret put MOLLIE_API_KEY --config wrangler.jsonc
          printf '%s' "$SUPABASE_SERVICE_KEY" | npx --yes wrangler@latest secret put SUPABASE_SERVICE_KEY --config wrangler.jsonc
          printf '%s' "$MOLLIE_WEBHOOK_SECRET" | npx --yes wrangler@latest secret put MOLLIE_WEBHOOK_SECRET --config wrangler.jsonc
      - name: Verify deploy fingerprint
        env:
          DOMAIN: ${{ matrix.domain }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          echo "Verifying deploy fingerprint for ${{ matrix.domain }}..."
          echo "Expected commit SHA: $EXPECTED_SHA"
          
          for i in 1 2 3 4 5; do
            # Fetch version.json from live domain
            response=$(curl -sS -o /tmp/version.json -w "%{http_code}" --max-time 20 \
              -A "Mozilla/5.0" "https://$DOMAIN/version.json" || true)
            code=${response: -3}
            
            if [ "$code" = "200" ]; then
              # Parse version.json
              DEPLOYED_SHA=$(cat /tmp/version.json | grep -o '"b":"[^"]*"' | cut -d'"' -f4)
              DEPLOYED_VERSION=$(cat /tmp/version.json | grep -o '"v":"[^"]*"' | cut -d'"' -f4)
              
              echo "Deployed version: $DEPLOYED_VERSION"
              echo "Deployed commit (short): $DEPLOYED_SHA"
              echo "Expected commit (full): $EXPECTED_SHA"
              
              if [ -z "$DEPLOYED_SHA" ]; then
                echo "WARNING: No commit SHA found in version.json"
                cat /tmp/version.json
              else
                # Check if deployed SHA matches expected (compare first 7 chars)
                EXPECTED_SHORT=${EXPECTED_SHA:0:7}
                if [ "$DEPLOYED_SHA" = "$EXPECTED_SHORT" ]; then
                  echo "✓ FINGERPRINT MATCH: Deployed commit $DEPLOYED_SHA matches expected $EXPECTED_SHORT"
                  exit 0
                else
                  echo "✗ FINGERPRINT MISMATCH: Deployed $DEPLOYED_SHA != Expected $EXPECTED_SHORT"
                  echo "Deploy may be stale or failed. Retrying..."
                fi
              fi
            else
              echo "Attempt $i: version.json returned HTTP $code, retrying..."
            fi
            
            if [ $i -lt 5 ]; then
              sleep $((i*10))
            fi
          done
          
          echo "FAIL: Could not verify deploy fingerprint after 5 attempts"
          cat /tmp/version.json 2>/dev/null || echo "No version.json retrieved"
          exit 1

      - name: Payment API smoke
        env:
          DOMAIN: ${{ matrix.domain }}
        run: |
          code=$(curl -sS -o /tmp/mollie-smoke.json -w "%{http_code}" --max-time 20 \
            -X POST -H "Content-Type: application/json" \
            --data '{"action":"__payment_smoke__"}' \
            "https://$DOMAIN/api/mollie.php" || true)
          cat /tmp/mollie-smoke.json || true
          if [ "$code" != "400" ]; then
            echo "Payment API smoke failed: expected HTTP 400 from a configured Worker, got $code"
            exit 1
          fi
          if grep -Eq '"error":"(payment_backend_not_configured|api_route_not_migrated)' /tmp/mollie-smoke.json; then
            echo "Payment backend is not configured or route is not migrated"
            exit 1
          fi
