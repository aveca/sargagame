name: weekly-pois
on:
  schedule:
    - cron: '0 3 * * 0' # dimanche 3h
  workflow_dispatch:
jobs:
  pois:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-pois.cjs
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add public/api/pois.json
          git diff --staged --quiet || (git commit -m "chore(pois): weekly Overpass update" && git push)
