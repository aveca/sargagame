name: Perf Budget + Lighthouse

# Garde-fou perf sur les PR (et push main) : build → budget gzip du JS eager (bloquant)
# → Lighthouse CI mobile (report-only pour l'instant, cf. lighthouserc.json). Empêche une
# régression du chemin critique (ex. un chunk lazy redevenu eager) de partir en prod.

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

# Une PR qui pousse plusieurs fois → on annule les runs perf obsolètes.
concurrency:
  group: perf-budget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci

      - name: Build
        run: npm run build

      - name: Bundle budget (gzip, eager JS) — bloquant
        run: node scripts/check-bundle-budget.cjs

      - name: Lighthouse CI (mobile) — report-only
        continue-on-error: true
        timeout-minutes: 10
        run: timeout --signal=TERM --kill-after=30s 9m npx --yes @lhci/cli@0.14.x autorun || status=$?; if [ "${status:-0}" -eq 124 ] || [ "${status:-0}" -eq 143 ]; then echo 'Lighthouse timed out; report-only gate intentionally non-blocking.'; exit 0; fi; exit "${status:-0}"
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}