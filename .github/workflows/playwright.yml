name: Playwright E2E

on:
  pull_request:
    branches: [main]

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Build project
        run: npm run build
      - name: Start Vite preview
        run: |
          nohup npx vite preview --port 4173 --host 127.0.0.1 > /tmp/vite-preview.log 2>&1 &
          echo $! > /tmp/vite-preview.pid
      - name: Wait for preview server
        timeout-minutes: 2
        run: |
          for i in {1..30}; do
            if curl -fs http://127.0.0.1:4173 >/dev/null; then echo "Preview server ready"; exit 0; fi
            sleep 1
          done
          echo "Preview server failed to start"
          cat /tmp/vite-preview.log
          exit 1
      - name: Run Playwright tests
        run: npx playwright test tests/e2e/funnel-payment.spec.ts tests/e2e/bottomnav-redesign.spec.ts
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/report/
          retention-days: 14
