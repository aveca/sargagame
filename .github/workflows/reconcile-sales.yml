name: reconcile-sales

on:
  workflow_dispatch:
    inputs:
      send:
        description: 'Écrire le rapport JSON dans le repo (--send)'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Exécuter le rapprochement ventes Mollie <-> Supabase
        env:
          MOLLIE_API_KEY: ${{ secrets.MOLLIE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/automation/reconcile-mollie-sales.cjs --send

      - name: Commit et pousser le rapport s'il a changé
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git status --porcelain scripts/automation/data/reconcile-sales.json | grep -q .; then
            git add scripts/automation/data/reconcile-sales.json
            git commit -m "feat(p0): rapport de rapprochement ventes Mollie/Supabase ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          else
            echo "Aucun changement dans le rapport de rapprochement."
          fi
