name: reconcile-sales

on:
  workflow_dispatch:
    inputs:
      confirm_live_read_only:
        description: 'Confirmer une lecture Mollie/Supabase sans publication de données transactionnelles'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  reconcile:
    if: ${{ inputs.confirm_live_read_only == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Exécuter le rapprochement en lecture seule (sortie transactionnelle masquée)
        env:
          MOLLIE_API_KEY: ${{ secrets.MOLLIE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/automation/reconcile-mollie-sales.cjs
