name: Replace sg-noso routes (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode: plan (read-only) or apply (execute replacement)'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read

jobs:
  replace-routes:
    name: Replace sg-noso routes (${{ github.event.inputs.mode }})
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Validate secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::CLOUDFLARE_API_TOKEN secret missing"; exit 1; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::error::CLOUDFLARE_ACCOUNT_ID secret missing"; exit 1; fi
          echo "Secrets OK"

      - name: Run route replacement script
        run: node scripts/sg-cf-remove-noso-routes.cjs ${{ github.event.inputs.mode }}

      - name: Summary
        if: always()
        run: |
          echo "## Route replacement (${{ github.event.inputs.mode }})" >> $GITHUB_STEP_SUMMARY
          echo "See job logs for per-domain details." >> $GITHUB_STEP_SUMMARY