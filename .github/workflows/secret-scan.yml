name: Secret scan

on:
  push:
    branches: [main, gh-pages]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Block payment credential files
        run: |
          HITS=$(git ls-files | grep -E '(^|/)(stripe|paypal|mollie)-config\.php$|(^|/)_deploy-secret\.php$' || true)
          if [ -n "$HITS" ]; then
            echo "::error::Payment credential file tracked in git:"
            echo "$HITS"
            exit 1
          fi

      - name: Block raw live key patterns
        run: |
          HITS=$(git grep -I -n -E 'sk_live_[A-Za-z0-9]{20,}|live_[A-Za-z0-9]{20,}' -- . ':(exclude)*-config.example.php' ':(exclude).ai/plans/*' ':(exclude)NEXT_SESSION.md' ':(exclude)src/*.jsx' || true)
          if [ -n "$HITS" ]; then
            echo "::error::Raw live API key pattern found in tracked files:"
            echo "$HITS"
            exit 1
          fi
