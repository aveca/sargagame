name: Secret scan

on:
  push:
    branches: [main, gh-pages]
  pull_request:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Block payment credential files
        run: |
          HITS=$(git ls-files | grep -E '(^|/)(stripe|paypal|mollie)-config\.php$|(^|/)_deploy-secret\.php$' || true)
          if [ -n "$HITS" ]; then
            echo "::error::Payment credential file tracked in git:"
            echo "$HITS"
            exit 1
          fi

      - name: Block raw live key patterns
        # pk_live_/pk_test_ = clés PUBLISABLES Stripe (frontend par design, jamais
        # secrètes) → exclues du gate (faux positif prouvé PR #627 sur tmp/out2.js).
        # Les vrais secrets Mollie `live_*` restent détectés (2e grep garde le verdict).
        # A12 : `.ai/plans/*` N'EST PLUS exclu — une clé Mollie live y a fuité
        # (plan.md) précisément à cause de cette exclusion. Les docs sont scannés.
        run: |
          HITS=$(git grep -I -n -E 'sk_live_[A-Za-z0-9]{20,}|live_[A-Za-z0-9]{20,}' -- . ':(exclude)*-config.example.php' ':(exclude)NEXT_SESSION.md' ':(exclude)src/*.jsx' | grep -v -E 'pk_(live|test)_' || true)
          if [ -n "$HITS" ]; then
            echo "::error::Raw live API key pattern found in tracked files:"
            echo "$HITS"
            exit 1
          fi
