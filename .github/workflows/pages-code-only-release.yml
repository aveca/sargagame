name: Pages Code-Only Release

# Publishes the already-approved frontend from main to Cloudflare Pages only.
# It copies the exact currently served regional satellite payload into each
# prepared artifact and recomputes only dataAgeMinutes/stale. It never deploys
# a Worker, changes a payment secret, or publishes a new satellite observation.
on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Confirm a six-domain Pages-only production release (Worker/payment stack untouched)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sargagame-pages-code-only-release
  cancel-in-progress: false

jobs:
  gate:
    if: github.ref == 'refs/heads/main' && inputs.confirm_production == true && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # La suite de tests lit `dist/` (artefact Vite) : le build doit preceder
      # `npm test`, exactement comme le job `test-frontend` de ci-tests.yml.
      # Sans ce build, `tests/sitemap-guard-beach-pages.test.cjs` echoue
      # ("dist/ absent - vite build d'abord") et le gate refuse la release
      # (run 42215481383, job gate, step "Unit and contract tests").
      - name: Verify Build
        run: npm run build
      - name: Unit and contract tests
        run: npm test

  prepare:
    needs: gate
    if: needs.gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - region: mq
            ftp_dir: martinique-ftp
            pages_dir: martinique-ftp-pages
            project: sargagame
          - region: gp
            ftp_dir: guadeloupe-ftp
            pages_dir: guadeloupe-ftp-pages
            project: sargagame-gp
          - region: florida
            ftp_dir: florida-ftp
            pages_dir: florida-ftp-pages
            project: sargagame-florida
          - region: puntacana
            ftp_dir: puntacana-ftp
            pages_dir: puntacana-ftp-pages
            project: sargagame-puntacana
          - region: rivieramaya
            ftp_dir: rivieramaya-ftp
            pages_dir: rivieramaya-ftp-pages
            project: sargagame-rivieramaya
          - region: tulum
            ftp_dir: tulum-ftp
            pages_dir: tulum-ftp-pages
            project: sargagame-tulum
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate regional configuration
        run: node -e "require('./regions/index.cjs').assertAllRegionsValid()"
      - name: Build frontend
        env:
          VITE_REGION: ${{ matrix.region }}
        run: npm run build
      - name: Enforce eager bundle budget
        run: node scripts/check-bundle-budget.cjs
      - name: Prepare regional Pages artifact
        env:
          VITE_REGION: ${{ matrix.region }}
        run: node scripts/prepare-ftp.cjs
      - name: Preserve current live observations and refresh metadata only
        run: node scripts/automation/prepare-pages-code-only-payload.cjs --region ${{ matrix.region }}
      # L'artefact Pages SANS PHP est reconstruit APRÈS le rafraîchissement du
      # payload : l'artefact publié doit être EXACTEMENT celui qui a été
      # audité ci-dessous, moins les fichiers PHP.
      - name: Rebuild the PHP-free Pages artifact
        env:
          VITE_REGION: ${{ matrix.region }}
        run: node scripts/prepare-ftp.cjs --pages-only
      # Garde-fou : aucun fichier PHP ne doit être publié sur Pages (constat
      # live 2026-11-07 : 24/36 endpoints servaient le code source PHP en
      # clair sur les six *.pages.dev). Le dossier FTP conserve ses .php
      # (money path historique) — seul l'artefact Pages est amputé.
      - name: Assert the Pages artifact contains no PHP
        run: node scripts/inventory-pages-artifacts.cjs --region ${{ matrix.region }}
      - name: Validate prepared HTML
        env:
          VITE_REGION: ${{ matrix.region }}
        run: node scripts/autopilot/check-prepared-html.cjs
      - name: Guard regional data separation
        run: node scripts/check-regional-artifact.cjs --region ${{ matrix.region }}
      - name: Upload prepared regional artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-code-only-${{ matrix.region }}
          path: ${{ matrix.pages_dir }}/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 2

  capture-rollback:
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Capture previous successful production deployments
        run: node scripts/automation/pages-code-only-rollback.cjs capture --file pages-code-only-rollback.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-code-only-rollback
          path: pages-code-only-rollback.json
          if-no-files-found: error
          retention-days: 2

  deploy-pages:
    needs: [prepare, capture-rollback]
    if: needs.prepare.result == 'success' && needs.capture-rollback.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - region: mq
            ftp_dir: martinique-ftp
            project: sargagame
          - region: gp
            ftp_dir: guadeloupe-ftp
            project: sargagame-gp
          - region: florida
            ftp_dir: florida-ftp
            project: sargagame-florida
          - region: puntacana
            ftp_dir: puntacana-ftp
            project: sargagame-puntacana
          - region: rivieramaya
            ftp_dir: rivieramaya-ftp
            project: sargagame-rivieramaya
          - region: tulum
            ftp_dir: tulum-ftp
            project: sargagame-tulum
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pages-code-only-${{ matrix.region }}
          path: ${{ matrix.pages_dir }}
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ matrix.pages_dir }} --project-name=${{ matrix.project }} --branch=main

  verify:
    needs: deploy-pages
    if: needs.deploy-pages.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify all six live user journeys
        run: node scripts/automation/user-journey-audit.cjs --out user-journey-report.json
      - name: Require zero blocking live defects
        run: |
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('user-journey-report.json','utf8'));console.log(JSON.stringify(r.summary));if(r.summary.blocking>0)process.exit(1)"
      - name: Upload live verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-code-only-live-verification
          path: |
            user-journey-report.json
            scripts/automation/data/journeys/
          if-no-files-found: ignore
          retention-days: 30

  rollback:
    needs: [capture-rollback, deploy-pages, verify]
    if: always() && needs.capture-rollback.result == 'success' && (needs.deploy-pages.result != 'success' || needs.verify.result != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pages-code-only-rollback
      - name: Restore previous successful production deployments
        run: node scripts/automation/pages-code-only-rollback.cjs rollback --file pages-code-only-rollback.json
