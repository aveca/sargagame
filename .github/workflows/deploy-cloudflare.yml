name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        region:
          - mq
          - gp
          - florida
          - puntacana
          - rivieramaya
          - tulum
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install wrangler
        run: npm install -g wrangler && echo "$(npm bin -g)" >> $GITHUB_PATH

      - name: Build and deploy region
        run: |
          echo "Building region ${{ matrix.region }}..."
          # Map region to project name
          case "${{ matrix.region }}" in
            mq) PROJECT="sargagame" ;;
            gp) PROJECT="sargagame-gp" ;;
            florida) PROJECT="sargagame-florida" ;;
            puntacana) PROJECT="sargagame-puntacana" ;;
            rivieramaya) PROJECT="sargagame-rivieramaya" ;;
            tulum) PROJECT="sargagame-tulum" ;;
          esac
          echo "Building region ${{ matrix.region }} â†’ $PROJECT"
          
          if [ "${{ matrix.region }}" = "mq" ]; then
            DEPLOY_TARGET=cloudflare NODE_ENV=production npm run build
          else
            DEPLOY_TARGET=cloudflare NODE_ENV=production VITE_REGION=${{ matrix.region }} npm run build
          fi
          
          mkdir -p dist/api/copernicus
          for F in sargassum.json history.json; do
            SRC="public/api/copernicus/${{ matrix.region }}/$F"
            if [ -f "$SRC" ]; then
              cp "$SRC" "dist/api/copernicus/$F"
              echo "  â†’ Copied ${{ matrix.region }}/$F"
            fi
          done
          
          # SECURITE (2026-08-24): NE PAS ecrire mollie-config.php (secret webhook)
          # dans dist/ - Pages sert les .php comme fichiers STATIQUES (source +
          # secret exposes publiquement, P0 corrige). Le payment path = worker
          # b2b-api (secret cote worker). Aucun .php de config sur Pages.
          
          npx wrangler pages deploy dist --project-name=$PROJECT --branch=main || echo "âš ï¸ Deploy failed for $PROJECT (continuing...)"
          echo "â”€â”€ Done ${{ matrix.region }} â”€â”€"
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MOLLIE_WEBHOOK_SECRET: ${{ secrets.MOLLIE_WEBHOOK_SECRET }}
