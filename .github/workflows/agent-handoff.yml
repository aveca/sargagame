name: Agent Handoff Automation

on:
  schedule:
    # Toutes les 4 heures : vérifie s'il y a du travail en attente
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Task ID to force-pick (e.g., TASK-P1-001)'
        required: false
        type: string
      agent_type:
        description: 'Agent type to run (coding, qa, ui, security, devops, data, growth)'
        required: false
        type: string
        default: 'coding'

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  agent-handoff:
    name: Agent Handoff Loop
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      # ══════════════════════════════════════════════════════════════
      # 1. SETUP — Checkout + Node + Dependencies
      # ══════════════════════════════════════════════════════════════
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      # ══════════════════════════════════════════════════════════════
      # 2. READ STATE — Lire current_state + tasks
      # ══════════════════════════════════════════════════════════════
      - name: Read current state
        id: read_state
        run: |
          echo "=== CURRENT STATE ==="
          cat .ai/current_state.md | head -80
          echo ""
          echo "=== TASKS BACKLOG ==="
          cat .ai/tasks.md

      # ══════════════════════════════════════════════════════════════
      # 3. PICK TASK — Choisir la priorité #1 disponible
      # ══════════════════════════════════════════════════════════════
      - name: Pick next task
        id: pick_task
        run: |
          # Si task_id forc� via workflow_dispatch
          if [ -n "${{ github.event.inputs.task_id }}" ]; then
            TASK_ID="${{ github.event.inputs.task_id }}"
            AGENT_TYPE="${{ github.event.inputs.agent_type }}"
            echo "Forced task: $TASK_ID by $AGENT_TYPE"
          else
            # Parser .ai/tasks.md pour trouver la premi�re t�che [ ] non assign�e
            # Priorit� : P0 > P1 > P2 > P3, ordre FIFO dans le fichier
            # Format r�el : ### TASK-PX-XXX ... - **Statut** : [ ] pending
            # On utilise Python pour parser correctement le format markdown
            python3 <<'PY' > /tmp/pick_task.json
import re, json, sys
with open('.ai/tasks.md', 'r', encoding='utf-8') as f:
    content = f.read()

# Find all task sections with their status
# Pattern: ### TASK-PX-XXX followed by content until next ### or end
# Then find **Statut** : [ ] ...
sections = re.split(r'(^### TASK-P\d-\d{3}(?:\s|$))', content, flags=re.MULTILINE)
# sections alternates: prefix, task_id, content, task_id, content...

priority_order = {'P0': 0, 'P1': 1, 'P2': 2, 'P3': 2}
candidates = []

for i in range(1, len(sections), 2):
    task_header = sections[i]
    task_content = sections[i+1] if i+1 < len(sections) else ''
    task_id = task_header.strip().replace('### ', '')
    
    # Check for status line in this task's content
    # Format: - **Statut** : [ ] pending
    status_match = re.search(r'^-\s*\*\*Statut\*\*\s*:\s*\[([ x~])\]\s*(.+)$', task_content, re.MULTILINE)
    if not status_match:
        # Fallback: look for [ ] anywhere in task
        if '- [ ]' in task_content or '[ ]' in task_content:
            status = ' '
        else:
            continue
    else:
        status = status_match.group(1)
    
    if status == ' ':
        # Extract role
        role_match = re.search(r'\*\*R[oô]le\*\*\s*:\s*(\w+)', task_content)
        role = role_match.group(1) if role_match else 'coding'
        priority = priority_order.get(task_id.split('-')[1][0] if len(task_id.split('-')) > 1 else 'Z', 99)
        candidates.append((priority, task_id, role))

if not candidates:
    print(json.dumps({"task_id": "", "agent_type": ""}))
    sys.exit(0)

candidates.sort(key=lambda x: (x[0], x[1]))
task_id, role = candidates[0][1], candidates[0][2]
print(json.dumps({"task_id": task_id, "agent_type": role}))
PY
            if [ -s /tmp/pick_task.json ]; then
              TASK_ID=$(jq -r '.task_id' /tmp/pick_task.json)
              AGENT_TYPE=$(jq -r '.agent_type' /tmp/pick_task.json)
            else
              TASK_ID=""
              AGENT_TYPE=""
            fi
            if [ -z "$TASK_ID" ]; then
              echo "No pending tasks found"
              echo "task_id=" >> "$GITHUB_OUTPUT"
              echo "agent_type=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Auto-picked: $TASK_ID by $AGENT_TYPE"
          fi
          
          echo "task_id=$TASK_ID" >> $GITHUB_OUTPUT
          echo "agent_type=$AGENT_TYPE" >> $GITHUB_OUTPUT

      # ══════════════════════════════════════════════════════════════
      # 4. CLAIM TASK — Marquer comme in_progress
      # ══════════════════════════════════════════════════════════════
      - name: Claim task in tasks.md
        if: ${{ steps.pick_task.outputs.task_id != '' }}
        run: |
          TASK_ID="${{ steps.pick_task.outputs.task_id }}"
          AGENT_TYPE="${{ steps.pick_task.outputs.agent_type }}"
          
          # Mark the status line belonging to this task as in_progress.
          python3 - "$TASK_ID" "$AGENT_TYPE" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path('.ai/tasks.md')
          task_id, agent_type = sys.argv[1], sys.argv[2]
          content = p.read_text(encoding='utf-8')
          
          # Find the task section first
          task_section_pattern = rf'(^### {re.escape(task_id)}(?:\s|$).*?)(?=^### TASK-P|\Z)'
          task_match = re.search(task_section_pattern, content, re.MULTILINE | re.DOTALL)
          if not task_match:
              raise SystemExit(f'Task {task_id} not found')
          
          task_content = task_match.group(1)
          
          # Find the status line within this task
          status_pattern = r'^-\s*\*\*Statut\*\*\s*:\s*\[([ x~])\]\s*(.+)$'
          status_match = re.search(status_pattern, task_content, re.MULTILINE)
          if not status_match:
              raise SystemExit(f'Status line not found in task {task_id}')
          
          status_char = status_match.group(1)
          status_rest = status_match.group(2)
          full_status_line = status_match.group(0)
          
          if status_char != ' ':
              raise SystemExit(f'Task {task_id} already claimed (status: {status_char})')
          
          # Replace only this specific line
          new_status = full_status_line.replace(f'- **Statut** : [{status_char}]', f'- **Statut** : [~] {task_id} ?" in_progress by {agent_type}_agent', 1)
          
          # Replace in the full content using precise positions
          new_content = content[:task_match.start(1) + status_match.start(0)] + new_status + content[task_match.start(1) + status_match.end(0):]
          p.write_text(new_content, encoding='utf-8')
          PY
          
          git config user.name "agent-handoff[bot]"
          git config user.email "agent-handoff@users.noreply.github.com"
          git add .ai/tasks.md
          git commit -m "chore(tasks): claim $TASK_ID by ${AGENT_TYPE}_agent"
          git push

      # ══════════════════════════════════════════════════════════════
      # 5. CREATE BRANCH — Branche de travail agent/<type>/<task>
      # ══════════════════════════════════════════════════════════════
      - name: Create work branch
        if: ${{ steps.pick_task.outputs.task_id != '' }}
        run: |
          TASK_ID="${{ steps.pick_task.outputs.task_id }}"
          AGENT_TYPE="${{ steps.pick_task.outputs.agent_type }}"
          BRANCH="agent/${AGENT_TYPE}/${TASK_ID}"
          
          git checkout -b "$BRANCH"
          git push -u origin "$BRANCH"
          
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      # ══════════════════════════════════════════════════════════════
      # 6. EXECUTE WORK — Lancer l'agent approprié
      # ══════════════════════════════════════════════════════════════
      - name: Execute agent work
        if: ${{ steps.pick_task.outputs.task_id != '' }}
        id: agent_work
        run: |
          TASK_ID="${{ steps.pick_task.outputs.task_id }}"
          AGENT_TYPE="${{ steps.pick_task.outputs.agent_type }}"
          
          echo "=== Starting work for $TASK_ID as $AGENT_TYPE agent ==="
          
          # Selon le type d'agent, lancer le script approprié
          case "$AGENT_TYPE" in
            coding)
              # Pour coding agent : on ne peut pas coder vraiment en CI
              # On crée une issue pour qu'un agent externe (OpenCode/Codex/CC) la prenne
              echo "Coding task requires external agent. Creating tracking issue..."
              gh issue create \
                --title "[AUTO] $TASK_ID — Assigned to coding_agent" \
                --body "## Task: $TASK_ID

            **Assigned to**: coding_agent (external: OpenCode/Codex/Claude Code)
            **Branch**: \`agent/coding/$TASK_ID\`
            **Instructions**:
            1. Read \`.ai/current_state.md\` + \`.ai/tasks.md\`
            2. Work on branch \`agent/coding/$TASK_ID\`
            3. Follow Gate de ship (build + smoke + bundle + PHP lint)
            4. Update \`.ai/changelog.md\` + \`.ai/current_state.md\` + \`.ai/tasks.md\`
            5. Push + PR → auto-merge if CI green

            **Gate de ship**:
            - \`npm run build\` exit 0
            - \`node scripts/check-bundle-budget.cjs\` ≤ 210 Ko
            - \`php -l\` on modified PHP files
            - \`node scripts/ux-smoke.mjs\` → 4 tokens OK

            See \`.ai/roles/coding-agent.md\` for full role definition." \
                --label "agent:coding,auto-assigned" \
                --assignee "@me"
              ;;
            qa)
              echo "Running QA agent: Playwright E2E tests..."
              # Lancer les tests Playwright existants
              npx playwright test --reporter=line || true
              ;;
            ui)
              echo "UI agent: Visual regression check..."
              # Build + preview + capture screenshots
              npm run build
              npx vite preview --port 4173 &
              sleep 5
              npx playwright test tests/visual-regression.spec.ts --reporter=line || true
              kill %1
              ;;
            security)
              echo "Security agent: Audit dependencies + secrets scan..."
              npm audit --audit-level=high || true
              # Scan secrets
              if grep -rE "(live_|sk_|sb_secret_)" --include="*.js" --include="*.jsx" --include="*.ts" --include="*.php" src/ public/ scripts/ 2>/dev/null | grep -v ".example.php" | grep -v "node_modules"; then
                echo "⚠️ POTENTIAL SECRETS FOUND!"
                exit 1
              fi
              echo "No secrets in committed code"
              ;;
            devops)
              echo "DevOps agent: Check CI/CD health..."
              gh run list --repo ${{ github.repository }} --limit 10 --json conclusion,headBranch,createdAt --jq '.[] | "\(.conclusion)\t\(.headBranch)\t\(.createdAt)"'
              ;;
            data)
              echo "Data agent: Check pipeline freshness..."
              node -e "
                const d=JSON.parse(require('fs').readFileSync('public/api/copernicus/sargassum.json'));
                const run=(Date.now()-new Date(d.updatedAt))/3.6e6;
                const sat=d.erddapTimestamp?(Date.now()-new Date(d.erddapTimestamp).getTime())/3.6e6:null;
                console.log('Pipeline age:', run.toFixed(1)+'h', run<12?'OK':'STALE');
                console.log('Satellite age:', sat?sat.toFixed(1)+'h':'n/a', (d.stale||(sat&&sat>=36))?'STALE':'OK');
              "
              ;;
            growth)
              echo "Growth agent: Check business metrics..."
              node -e "
                const d=JSON.parse(require('fs').readFileSync('scripts/automation/data/daily-metrics.json','utf-8'));
                const l=d[d.length-1];
                console.log('Last:', l.date, '| Payments:', l.payments, '| Emails:', l.emails);
                const s=[...d].reverse().find(x=>x.stripe&&x.stripe.active!=null).stripe;
                console.log('MRR Stripe: €'+s.mrr.eur+' |', s.active, 'actifs');
              "
              ;;
            *)
              echo "Unknown agent type: $AGENT_TYPE"
              exit 1
              ;;
          esac
          
          echo "Agent work step completed for $TASK_ID"

      # ══════════════════════════════════════════════════════════════
      # 7. VALIDATE — Gate de ship (si coding agent a poussé du code)
      # ══════════════════════════════════════════════════════════════
      - name: Validate Gate de ship
        if: ${{ steps.pick_task.outputs.task_id != '' && github.event.inputs.task_id == '' }}
        run: |
          # Ce step ne s'exécute que si le travail a été fait sur la branche
          # En pratique, l'agent externe pousse sur la branche, puis ce workflow
          # peut être re-déclenché sur push pour valider
          echo "Gate validation would run here on push to agent/* branch"
          echo "See .github/workflows/ci-tests.yml for actual CI gate"

      # ══════════════════════════════════════════════════════════════
      # 8. HANDOFF — Créer PR + documenter
      # ══════════════════════════════════════════════════════════════
      - name: Create handoff PR
        if: ${{ steps.pick_task.outputs.task_id != '' && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/agent/') }}
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          TASK_ID=$(echo "$BRANCH" | cut -d'/' -f3)
          AGENT_TYPE=$(echo "$BRANCH" | cut -d'/' -f2)
          
          # Vérifier que les checks passent
          # (En réalité, ci-tests.yml valide déjà)
          
          gh pr create \
            --title "$TASK_ID: ${AGENT_TYPE} agent work" \
            --body "## Automated handoff PR

            **Task**: $TASK_ID
            **Agent**: ${AGENT_TYPE}_agent
            **Branch**: \`$BRANCH\`

            ### Changes
            \`\`\`diff
            $(git diff --stat main...HEAD)
            \`\`\`

            ### Gate de ship
            - [ ] Build passed
            - [ ] Bundle budget ≤ 210 Ko
            - [ ] PHP lint passed
            - [ ] Smoke tests: 4 tokens OK

            ### Handoff
            - \`.ai/changelog.md\` updated
            - \`.ai/current_state.md\` updated (template)
            - \`.ai/tasks.md\` → [x] done

            **Auto-merge**: Will merge when all checks pass (mandat fondateur 100% mobile)." \
            --base main \
            --label "auto-handoff,${AGENT_TYPE}"

      # ══════════════════════════════════════════════════════════════
      # 9. SAFETY — No implicit merge from this scheduled/manual worker
      # ══════════════════════════════════════════════════════════════
      # Merging is handled by repository PR checks/merge policy.
      # This workflow must never pretend that a coding task is complete
      # or merge a PR without the normal CI gates.

      # 10. HANDOFF STATE
      - name: Report handoff state
        if: ${{ steps.pick_task.outputs.task_id != '' }}
        run: |
          echo "Task handoff prepared: ${{ steps.pick_task.outputs.task_id }}"
          echo "No implicit merge is performed by this workflow."
